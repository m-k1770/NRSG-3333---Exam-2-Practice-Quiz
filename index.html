ate each option against safety principles."}, {"t": "mc", "q": "On percussion, a client's chest reveals a dull, flat sound over one lung field, along with decreased to absent breath sounds and decreased tactile fremitus in that area. These findings are most consistent with:", "o": ["Pneumothorax", "Pleural effusion", "Chronic bronchitis", "Normal lung findings"], "a": [1], "e": ["Pneumothorax produces a hyperresonant, not dull/flat, percussion note.", "", "Chronic bronchitis typically produces a resonant percussion note with normal or near-normal fremitus.", "Normal lung findings would show a resonant percussion note with normal breath sounds and fremitus."], "r": "Pleural effusion is characterized by a dull-to-flat percussion note over the fluid, decreased-to-absent breath sounds, and decreased tactile fremitus, because the fluid-filled pleural space blocks transmission of sound.", "tip": "NCLEX Tip: Fluid (effusion) and consolidation (pneumonia) both dull percussion, but pneumonia INCREASES fremitus/transmitted voice sounds while effusion DECREASES them — a key differentiator."}, {"t": "mc", "q": "A client with lobar pneumonia would be expected to have which combination of assessment findings?", "o": ["Hyperresonant percussion with decreased fremitus", "Dull percussion over the airless area with bronchial breath sounds and increased fremitus/transmitted voice sounds", "Resonant percussion with a midline trachea and normal vesicular sounds only", "Tympanic percussion with absent breath sounds"], "a": [1], "e": ["Hyperresonance with decreased fremitus is more consistent with pneumothorax.", "", "This describes a normal lung assessment, not pneumonia.", "Tympanic percussion with absent breath sounds is not the classic pneumonia presentation."], "r": "In lobar pneumonia, alveoli fill with fluid or exudate, producing dullness on percussion over the airless area, bronchial breath sounds over the consolidation, and increased tactile fremitus with increased transmitted voice sounds (bronchophony, egophony, whispered pectoriloquy).", "tip": "NCLEX Tip: Consolidation (pneumonia) = dull + bronchial breath sounds + INCREASED fremitus, a distinct pattern from effusion, which decreases fremitus."}, {"t": "mc", "q": "A client presents with a tracheal shift AWAY from the affected side, hyperresonant percussion, and decreased-to-absent breath sounds on that side. This presentation is most consistent with:", "o": ["Pleural effusion", "Pneumothorax", "Partial lobar obstruction (atelectasis)", "Left-sided heart failure"], "a": [1], "e": ["Pleural effusion also shifts the trachea away from the affected side (with a large effusion) but produces DULL, not hyperresonant, percussion.", "", "Atelectasis from a mainstem bronchus obstruction typically shifts the trachea TOWARD the involved side, not away, and produces dull percussion.", "Left-sided heart failure (early) typically produces resonant percussion with a midline trachea and late inspiratory crackles."], "r": "Pneumothorax occurs when air leaks into the pleural space, causing the lung to recoil away from the chest wall; this produces hyperresonant (tympanic) percussion, a trachea shifted toward the unaffected side, and decreased-to-absent breath sounds over the affected area.", "tip": "NCLEX Tip: Pneumothorax = hyperresonant + trachea shifts AWAY from the affected side; atelectasis = dull + trachea shifts TOWARD the affected side — easy to confuse, so compare them side by side."}, {"t": "mc", "q": "Partial lobar obstruction (atelectasis) from a mucus plug is classically associated with which trachea finding?", "o": ["The trachea remains midline in all cases", "The trachea may be shifted TOWARD the involved side", "The trachea is always shifted away from the involved side", "Tracheal position is never affected by atelectasis"], "a": [1], "e": ["While mild cases may show a midline trachea, more significant volume loss classically shifts the trachea toward, not simply keeps it midline in 'all cases.'", "", "This is reversed; atelectasis shifts the trachea toward, not away from, the involved side due to volume loss.", "Tracheal position CAN be affected, particularly with more significant atelectasis."], "r": "With partial lobar obstruction/atelectasis, the loss of lung volume in the affected area can pull the trachea toward the involved side, which is the opposite of what occurs with pneumothorax or a large pleural effusion.", "tip": "NCLEX Tip: Remember: volume LOSS (atelectasis) pulls structures TOWARD it; volume/pressure GAIN (pneumothorax, large effusion) pushes structures AWAY from it."}, {"t": "mc", "q": "A client with COPD is being percussed and auscultated. Which findings would the nurse most expect?", "o": ["Dull percussion with bronchial breath sounds", "Diffusely hyperresonant percussion with decreased-to-absent breath sounds and delayed expiration", "Normal resonant percussion with clear breath sounds throughout", "Absent tactile fremitus bilaterally with a shifted trachea"], "a": [1], "e": ["This describes a consolidative process like pneumonia, not COPD.", "", "COPD typically shows abnormal, not entirely normal, findings due to hyperinflation.", "While fremitus is decreased in COPD, the trachea typically remains midline, unlike the tension pneumothorax pattern where it shifts."], "r": "COPD is a slowly progressive disorder in which distal airspaces enlarge and lungs become hyperinflated, producing diffusely hyperresonant percussion, decreased-to-absent breath sounds with delayed expiration, and decreased tactile fremitus, with a midline trachea.", "tip": "NCLEX Tip: COPD's hyperresonance is DIFFUSE/bilateral, while pneumothorax's hyperresonance is typically unilateral over the affected side — this distinction matters on exams."}, {"t": "mc", "q": "Early left-sided heart failure would most likely produce which auscultation finding?", "o": ["Bronchial breath sounds over a consolidated area", "Late inspiratory crackles in the dependent portions of the lungs, possibly with wheezes", "A pleural friction rub only", "Complete absence of breath sounds bilaterally"], "a": [1], "e": ["Bronchial breath sounds over consolidation are characteristic of pneumonia, not early heart failure.", "", "A pleural friction rub is more classically associated with pleuritis, not primarily early heart failure.", "Complete bilateral absence of breath sounds would suggest a much more severe or different process."], "r": "In early left-sided heart failure, increased pulmonary venous pressure causes congestion and interstitial edema, producing late inspiratory crackles in the dependent lung regions and possibly wheezes, while percussion and breath sound type typically remain relatively normal (resonant, vesicular).", "tip": "NCLEX Tip: Crackles in DEPENDENT lung regions that change with position (or clear with coughing, in some cases) point toward a fluid/heart failure process rather than a fixed consolidation."}, {"t": "fib", "q": "Fill in the blank: A ______ occurs when air leaks into the pleural space and the lung recoils away from the chest wall, producing hyperresonant percussion and absent breath sounds over the affected area.", "blanks": [["pneumothorax", "Pneumothorax"]], "r": "A pneumothorax is defined by air entering the pleural space, causing partial or complete lung collapse, hyperresonant percussion, and decreased-to-absent breath sounds on the affected side.", "tip": "NCLEX Tip: Memorize the classic pneumothorax triad: hyperresonance, decreased/absent breath sounds, and tracheal shift away from the affected side (in tension pneumothorax)."}, {"t": "mc", "q": "Which CVAD is generally favored in adult clients specifically because it decreases the risk of catheter-related thrombosis and infection compared to other central insertion sites?", "o": ["Femoral vein non-tunneled catheter", "Subclavian vein non-tunneled catheter", "Internal jugular vein catheter in all adult clients", "There is no difference in risk between insertion sites"], "a": [1], "e": ["The femoral site is generally associated with a higher, not lower, infection and thrombosis risk in most adult clients.", "", "While the internal jugular is a valid, commonly used site, the subclavian is specifically noted as favored for its lower thrombosis/infection risk in adults.", "Insertion site does affect complication risk, particularly thrombosis and infection rates."], "r": "The subclavian vein is favored in adult clients for non-tunneled CVAD insertion due to a decreased risk of catheter-related thrombosis and/or infection compared with other common insertion sites.", "tip": "NCLEX Tip: Site selection involves balancing infection/thrombosis risk (subclavian favored in adults) against other factors like ease of access and bleeding risk."}, {"t": "mc", "q": "Which client would be an important consideration to AVOID PICC line placement in, according to the CVAD summary content?", "o": ["A client needing 3 months of IV antibiotics", "A client with end-stage renal disease who needs vein preservation for future dialysis fistulas/grafts", "A client receiving chemotherapy", "A client needing frequent blood draws"], "a": [1], "e": ["Long-term antibiotic therapy is an appropriate use for a PICC line.", "", "Chemotherapy is a common, appropriate indication for PICC line use.", "Frequent blood draws are also a common, appropriate indication for PICC line use."], "r": "PICC lines should generally be avoided in clients with end-stage renal disease who require vein preservation for future arteriovenous fistulas or grafts, as well as those with a history of thrombosis, hypercoagulability, or decreased peripheral vascular flow.", "tip": "NCLEX Tip: Always consider a client's future vascular access needs (like dialysis access) before selecting an upper extremity site for a PICC line."}, {"t": "mc", "q": "Which statement accurately reflects the expected duration of use for a PICC line compared to a non-tunneled CVAD?", "o": ["A PICC line is intended for days to several weeks, while a non-tunneled CVAD may be used for up to six months", "A PICC line may be used for up to six months, while a non-tunneled CVAD is generally used for days to several weeks", "Both devices have identical expected durations of use", "Neither device has a defined expected duration"], "a": [1], "e": ["This reverses the correct durations for each device.", "", "These devices have different expected durations based on their design and insertion site.", "Each device does have a generally expected duration based on clinical guidelines."], "r": "A PICC line may be used for long-term therapy up to six months, while a non-tunneled CVAD is intended for short-term use, typically days to several weeks, reflecting differences in their design, insertion site, and infection risk profile.", "tip": "NCLEX Tip: Duration of use directly informs device selection — always match the expected length of therapy to the appropriate CVAD type."}, {"t": "mc", "q": "Which of the following client education points is appropriate when teaching a client and family about home management of a tunneled CVAD?", "o": ["No special teaching is required since tunneled catheters are maintenance-free", "Teaching on home care, signs of infection, and when to notify the provider is needed because tunneled CVCs are often used for extended, sometimes outpatient, therapy", "The family should be told the catheter never needs to be reported for any concerning symptoms", "Teaching should focus only on the cost of the device"], "a": [1], "e": ["Tunneled catheters still require ongoing home care education, including dressing/flushing care and infection monitoring.", "", "Families should absolutely be taught which symptoms warrant contacting the provider — this is a critical safety teaching point.", "Cost is not the clinically relevant focus of this education."], "r": "Because tunneled CVCs are commonly used for extended therapy, sometimes in the outpatient or home setting, patient/family education must include home care technique, recognizing signs of infection or other complications, and knowing when to notify the healthcare provider.", "tip": "NCLEX Tip: 'Patient education differs by device type' — tunneled and implanted devices used at home require more extensive family teaching than short-term inpatient non-tunneled lines."}], "m5": [{"t": "mc", "q": "During inhalation, which physiologic change allows air to rush into the lungs?", "o": ["The diaphragm relaxes and the thoracic cavity decreases in size", "The diaphragm contracts and flattens, expanding the thoracic cavity and creating negative pressure", "Intrathoracic pressure increases above atmospheric pressure", "The intercostal muscles relax completely during inhalation"], "a": [1], "e": ["This describes exhalation, not inhalation.", "", "Inhalation creates negative (not increased) intrathoracic pressure relative to atmospheric pressure, which is what draws air in.", "The intercostal muscles actively pull the rib cage outward/upward during inhalation, rather than relaxing."], "r": "During inhalation, the diaphragm contracts and flattens while the intercostal muscles pull the ribs outward, expanding the thoracic cavity and creating negative pressure, which causes air to move from the higher-pressure atmosphere into the lower-pressure lungs.", "tip": "NCLEX Tip: Air always flows from high pressure to low pressure — inhalation creates a vacuum (negative pressure) that pulls air in."}, {"t": "mc", "q": "Which of the following best explains why an open chest wound causes lung collapse?", "o": ["It increases the amount of surfactant in the alveoli", "It disrupts the negative intrathoracic pressure required to keep the lung expanded", "It has no effect on lung mechanics", "It only affects the unaffected lung, not the injured one"], "a": [1], "e": ["Surfactant production is unrelated to the mechanical effect of an open chest wound.", "", "An open chest wound significantly disrupts normal lung mechanics.", "The injured lung on the side of the wound is directly affected, along with potential mediastinal shift affecting the other lung."], "r": "Normal breathing depends on negative intrathoracic pressure; when the chest wall is breached, atmospheric air enters the pleural space, equalizing pressure and causing the lung to collapse due to its natural elastic recoil.", "tip": "NCLEX Tip: Any breach of the pleural space (trauma, chest tube insertion mishap, disconnected drainage system) can equalize pressure and cause lung collapse if not properly managed."}, {"t": "mc", "q": "A nurse hears low-pitched, continuous sounds on expiration described as resembling turbulent airflow through mucus in the large airways. This lung sound is best classified as:", "o": ["Rales (fine crackles)", "Rhonchi (coarse crackles)", "Stridor", "Pleural rub"], "a": [1], "e": ["Rales are popping/crackling sounds heard on inspiration associated with fluid in alveolar/interstitial spaces, not turbulent airflow through mucus.", "", "Stridor is heard only on inspiration and is associated with upper airway obstruction.", "A pleural rub sounds like rubbing leather and is caused by inflamed pleural membranes, not airway mucus."], "r": "Rhonchi (coarse crackles) are low-pitched, continuous sounds heard on expiration that indicate turbulent airflow through mucus in the large airways.", "tip": "NCLEX Tip: Rhonchi often clear or change after coughing, since they are related to mobile secretions in larger airways."}, {"t": "mc", "q": "A nurse auscultates fine, popping/crackling sounds on inspiration in a client with suspected heart failure. This finding is best described as:", "o": ["Rhonchi", "Rales (fine crackles)", "Wheezes", "Stridor"], "a": [1], "e": ["Rhonchi are coarse, low-pitched sounds heard on expiration, not fine crackles on inspiration.", "", "Wheezes are whistling sounds from narrowed airways, not popping/crackling sounds.", "Stridor is a harsh, high-pitched inspiratory sound from upper airway obstruction, not fine crackling."], "r": "Rales (fine crackles) are popping or crackling sounds heard on inspiration, associated with fluid accumulation within the alveolar and interstitial spaces, such as in heart failure or pneumonia.", "tip": "NCLEX Tip: Rales sound similar to rubbing strands of hair together near your ear — a helpful mental image for this fine, crackling quality."}, {"t": "mc", "q": "Stridor is a lung/airway sound that is:", "o": ["Heard only on expiration and associated with lower airway disease", "Heard only on inspiration and associated with obstruction of the trachea or upper airway", "Heard equally on inspiration and expiration and caused by pleural inflammation", "A normal variant with no clinical significance"], "a": [1], "e": ["Stridor is heard on inspiration, not expiration, and reflects upper, not lower, airway pathology.", "", "This describes a pleural friction rub, not stridor.", "Stridor is a significant clinical finding suggesting potential airway obstruction and should never be dismissed."], "r": "Stridor is a harsh, high-pitched sound heard only on inspiration, associated with obstruction of the trachea or upper airway, and requires prompt assessment given its association with potential airway compromise.", "tip": "NCLEX Tip: Stridor is a priority finding — think upper airway emergency (e.g., epiglottitis, foreign body, post-extubation swelling) until proven otherwise."}, {"t": "mc", "q": "A client reports pain with breathing, and the nurse auscultates a sound resembling the rubbing together of leather, heard on both inspiration and expiration. This finding is most consistent with:", "o": ["Wheezes", "Rales", "Pleural rub", "Rhonchi"], "a": [2], "e": ["Wheezes are whistling sounds from airway narrowing, not a leather-rubbing quality.", "Rales are fine crackling/popping sounds, not a leather-rubbing quality.", "", "Rhonchi are coarse, low-pitched sounds heard on expiration related to mucus, not a leather-rubbing quality."], "r": "A pleural rub sounds like the rubbing together of leather and is caused by inflammation of the pleural membranes, producing friction as the visceral and parietal pleura rub against each other during breathing.", "tip": "NCLEX Tip: A pleural rub is often accompanied by pleuritic chest pain that worsens with deep breathing, since inflamed pleural surfaces are involved."}, {"t": "mc", "q": "The primary physiologic driver of the respiratory rate under normal conditions is:", "o": ["Blood oxygen (hypoxemia) levels", "Blood carbon dioxide (CO2) concentration", "Blood glucose levels", "Hemoglobin concentration alone"], "a": [1], "e": ["Hypoxemia is a secondary driver, more important in clients with chronic CO2 retention (e.g., some COPD clients).", "", "Blood glucose is not a driver of respiratory rate.", "Hemoglobin concentration affects oxygen-carrying capacity but is not the primary driver of respiratory drive."], "r": "Under normal conditions, the concentration of carbon dioxide in the blood is the major factor driving breathing, sensed by central chemoreceptors in the brainstem, which stimulate increased rate and depth of respiration as CO2 rises (hypercapnia).", "tip": "NCLEX Tip: CO2 is the primary respiratory drive in most people; hypoxic drive becomes more relevant in clients with chronic hypercapnia (e.g., severe COPD)."}, {"t": "mc", "q": "A client is hyperventilating in response to severe anxiety and pain. The nurse understands this rapid, deep breathing pattern may also represent the body's attempt to:", "o": ["Retain carbon dioxide and worsen acidosis", "Eliminate excess carbon dioxide and increase blood pH, compensating for acidosis", "Increase blood glucose levels", "Decrease oxygen saturation intentionally"], "a": [1], "e": ["Hyperventilation eliminates, rather than retains, CO2.", "", "Hyperventilation is not related to blood glucose regulation.", "Hyperventilation typically increases, not decreases, oxygen saturation, aside from other underlying pathology."], "r": "Hyperventilation (rapid, deep breathing) can occur due to anxiety or pain, but it can also represent a compensatory mechanism for metabolic acidosis, as the body eliminates excess CO2 to raise blood pH.", "tip": "NCLEX Tip: Hyperventilation → blows off CO2 → respiratory alkalosis or compensation for metabolic acidosis; hypoventilation → retains CO2 → respiratory acidosis or compensation for metabolic alkalosis."}, {"t": "mc", "q": "A client receiving opioid pain medication develops slow, shallow breathing. This is best described as:", "o": ["Tachypnea", "Hypoventilation", "Hyperventilation", "Apnea"], "a": [1], "e": ["Tachypnea refers to rapid breathing, not slow/shallow breathing.", "", "Hyperventilation refers to rapid, deep breathing, the opposite of this presentation.", "Apnea refers to a complete absence of breathing, not merely slow/shallow breathing."], "r": "Hypoventilation refers to slow and shallow breathing, which can occur due to oversedation from opioids, exhaustion from prior hyperventilation, or as compensation for metabolic alkalosis.", "tip": "NCLEX Tip: Opioid-induced hypoventilation is a key safety concern requiring close respiratory monitoring, especially in the first hours after administration or dose increases."}, {"t": "mc", "q": "Ventilation-perfusion (V/Q) mismatch refers to:", "o": ["A perfectly matched ratio of airflow to blood flow in the lungs", "An imbalance between the air reaching the alveoli and the blood flow through the surrounding capillaries", "A condition that only affects the cardiovascular system, not the lungs", "A normal, expected finding in all healthy adults at rest"], "a": [1], "e": ["V/Q mismatch specifically describes an imbalance, not a perfect match.", "", "V/Q mismatch is a pulmonary gas exchange concept involving both airflow and blood flow in the lungs.", "V/Q mismatch is an abnormal finding associated with disease processes such as pulmonary edema or pulmonary embolism."], "r": "V/Q mismatch occurs when the ratio of air ventilating the alveoli (V) is not properly matched to the blood perfusing the surrounding capillaries (Q), leading to impaired gas exchange and hypoxia.", "tip": "NCLEX Tip: Pulmonary embolism causes a V/Q mismatch with normal ventilation but poor perfusion (blocked blood flow); pulmonary edema causes mismatch from poor ventilation despite normal perfusion."}, {"t": "mc", "q": "A pulmonary embolism (PE) most directly causes hypoxia through which mechanism?", "o": ["Fluid accumulation in the alveoli obstructing gas exchange", "A clot obstructing blood flow to a portion of lung tissue, impairing perfusion despite normal ventilation", "Bronchoconstriction of the large airways", "Increased surfactant production"], "a": [1], "e": ["This describes pulmonary edema, not a PE.", "", "Bronchoconstriction is characteristic of asthma, not a PE.", "Surfactant changes are not the primary mechanism of hypoxia in a PE."], "r": "A PE occurs when a clot travels through venous circulation and lodges in a pulmonary blood vessel, obstructing perfusion to that area of lung tissue despite normal ventilation, resulting in a V/Q mismatch and hypoxia; the affected lung tissue may die if blood flow is not restored.", "tip": "NCLEX Tip: PE classically presents with sudden dyspnea, chest pain, tachycardia, and anxiety/'sense of impending doom' — treat as a medical emergency."}, {"t": "mc", "q": "Which diagnostic test is most useful for visualizing blood flow directly within the pulmonary arteries to confirm a pulmonary embolism?", "o": ["D-dimer test", "CT pulmonary angiography (CTPA)", "Chest X-ray alone", "Complete blood count"], "a": [1], "e": ["A D-dimer is a nonspecific blood test that can suggest but not confirm a clot; it does not visualize the pulmonary arteries directly.", "", "A standard chest X-ray does not reliably diagnose a PE.", "A CBC does not diagnose a PE."], "r": "CT pulmonary angiography (CTPA) directly visualizes blood flow within the pulmonary arteries and is a primary diagnostic test used to confirm the presence and location of a pulmonary embolism.", "tip": "NCLEX Tip: D-dimer is useful to help RULE OUT a PE when negative (high sensitivity), but a positive result is nonspecific and requires further imaging like CTPA."}, {"t": "sata", "q": "Which of the following are recognized signs and symptoms of a pulmonary embolism? Select all that apply.", "o": ["Sudden shortness of breath", "Bradycardia with warm, dry skin", "Chest pain", "A sense of impending doom or sudden anxiety", "Coughing up blood"], "a": [0, 2, 3, 4], "e": ["", "PE typically causes tachycardia and diaphoresis, not bradycardia with warm, dry skin.", "", "", ""], "r": "Recognized signs and symptoms of PE include sudden dyspnea, chest pain, tachycardia (not bradycardia), sudden anxiety or a sense of impending doom, diaphoresis, lightheadedness, hemoptysis (coughing blood), and leg swelling/pain if a DVT is present.", "tip": "NCLEX Tip: PE causes a hyperadrenergic-type presentation (tachycardia, diaphoresis, anxiety) rather than a slow, calm one."}, {"t": "mc", "q": "A spontaneous pneumothorax occurs due to which mechanism?", "o": ["A stab wound to the chest wall", "Rupture of an air-filled bleb or blister on the surface of the lung in an apparently healthy person", "A gunshot wound to the abdomen", "Elective thoracentesis performed for a known pleural effusion"], "a": [1], "e": ["This describes a traumatic, not spontaneous, pneumothorax.", "", "This describes a traumatic pneumothorax mechanism.", "A planned procedure with an anticipated complication is different conceptually from a spontaneous pneumothorax in an otherwise healthy person, though thoracentesis can rarely cause an iatrogenic pneumothorax."], "r": "A simple (spontaneous) pneumothorax occurs when air enters the pleural space through rupture of an air-filled bleb or blister on the lung surface, often in an apparently healthy person, and may be associated with diffuse interstitial lung disease or severe emphysema.", "tip": "NCLEX Tip: 'Spontaneous' pneumothorax classically occurs in tall, thin young men and in clients with underlying lung disease due to bleb rupture."}, {"t": "mc", "q": "A traumatic pneumothorax can occur during which of the following invasive procedures?", "o": ["Oral medication administration", "Insertion of a subclavian central line where the pleura is inadvertently punctured", "Peripheral IV insertion", "Routine blood pressure measurement"], "a": [1], "e": ["Oral medication administration carries no risk of pneumothorax.", "", "Peripheral IV insertion does not involve the thoracic cavity and does not risk pneumothorax.", "Blood pressure measurement carries no risk of pneumothorax."], "r": "A traumatic pneumothorax may occur during invasive thoracic procedures such as thoracentesis, transbronchial lung biopsy, or subclavian line insertion, in which the pleura is inadvertently punctured.", "tip": "NCLEX Tip: Any central line inserted near the chest (subclavian, sometimes internal jugular) carries pneumothorax risk — this is why a post-procedure chest X-ray is required."}, {"t": "mc", "q": "An open pneumothorax occurs when a chest wall wound is large enough that air moves freely in and out with each breath, producing a characteristic sound. This is best described as:", "o": ["A 'sucking chest wound'", "Cardiac tamponade", "Simple pneumothorax only", "Pleural effusion"], "a": [0], "e": ["", "Cardiac tamponade involves fluid compressing the heart, not air moving through a chest wall wound.", "A simple pneumothorax does not involve an open communication with the outside atmosphere through a chest wall wound.", "Pleural effusion involves fluid accumulation, not air moving through an open chest wound."], "r": "An open pneumothorax occurs when a chest wall wound is large enough to allow air to pass freely in and out with each breath, producing a sucking sound at the wound site (a 'sucking chest wound'), and can cause mediastinal flutter/swing with serious circulatory compromise.", "tip": "NCLEX Tip: Emergency management of an open/sucking chest wound involves sealing it with an occlusive dressing taped on three sides to allow air to escape but not re-enter (a flutter valve effect), unless a true one-way commercial chest seal is used."}, {"t": "mc", "q": "Which type of pneumothorax involves a one-way valve mechanism where air enters the pleural space with each inspiration but cannot escape, leading to progressively increasing intrathoracic pressure?", "o": ["Simple pneumothorax", "Open pneumothorax", "Tension pneumothorax", "Iatrogenic pneumothorax from thoracentesis"], "a": [2], "e": ["A simple pneumothorax does not involve a progressive, trapped one-way air accumulation.", "In an open pneumothorax, air moves both in and out; it does not become progressively trapped in the same way as a tension pneumothorax.", "", "This describes tension pneumothorax specifically, not a general iatrogenic pneumothorax."], "r": "A tension pneumothorax occurs when air enters the pleural space with each inspiration but cannot be expelled, due to a one-way valve or ball-valve mechanism, causing progressively increasing intrathoracic pressure with each breath — a life-threatening emergency.", "tip": "NCLEX Tip: Tension pneumothorax is a true emergency requiring immediate needle decompression, followed by chest tube placement — do not wait for imaging confirmation if the client is unstable."}, {"t": "mc", "q": "A client with a suspected tension pneumothorax develops profound hypotension, tracheal deviation away from the affected side, and distended neck veins. The nurse should anticipate which emergency intervention?", "o": ["Immediate oral antibiotics", "Emergent needle decompression at the second intercostal space, midclavicular line on the affected side", "Scheduling an outpatient follow-up chest X-ray", "Placing the client in a fully flat supine position with no other intervention"], "a": [1], "e": ["Antibiotics do not address the acute, life-threatening pressure buildup of a tension pneumothorax.", "", "This is an emergency requiring immediate intervention, not outpatient scheduling.", "Positioning alone does not relieve the trapped pressure causing hemodynamic compromise."], "r": "A tension pneumothorax with hemodynamic compromise requires emergent needle decompression, typically at the second intercostal space, midclavicular line on the affected side, to relieve the trapped pressure and convert it to a simple pneumothorax before a chest tube is placed.", "tip": "NCLEX Tip: Tension pneumothorax signs (tracheal deviation AWAY from the affected side, JVD, hypotension, absent breath sounds unilaterally) require immediate needle decompression — this is a classic high-priority NCLEX scenario."}, {"t": "mc", "q": "Mediastinal flutter (or swing), in which the heart and great vessels shift toward the uninjured side with inspiration and back with expiration, is most associated with which condition?", "o": ["Simple pneumothorax", "Open (sucking) pneumothorax", "Pleural effusion", "Chronic bronchitis"], "a": [1], "e": ["Simple pneumothorax does not typically involve this dramatic mediastinal shifting with each breath.", "", "Pleural effusion may shift the mediastinum with a very large effusion, but mediastinal flutter with respiration is specifically described with open pneumothorax.", "Chronic bronchitis does not cause mediastinal flutter."], "r": "In an open pneumothorax, the rush of air through the chest wall wound not only collapses the lung but also causes the mediastinal structures (heart and great vessels) to shift with each breath — termed mediastinal flutter or swing — producing serious circulatory problems.", "tip": "NCLEX Tip: Mediastinal flutter is a hallmark complication specifically of open pneumothorax, distinguishing its severity from a simple, closed pneumothorax."}, {"t": "mc", "q": "A hemopneumothorax refers to:", "o": ["The presence of both blood and air in the pleural space", "A pneumothorax with no blood present at all", "A pleural effusion of clear serous fluid only", "A pneumothorax that has completely resolved"], "a": [0], "e": ["", "A hemopneumothorax specifically includes blood, in addition to air.", "This describes a simple serous pleural effusion, not a hemopneumothorax.", "This describes resolution, not the active presence of blood and air."], "r": "A hemopneumothorax refers to the presence of both blood (hemothorax) and air (pneumothorax) in the chest cavity, which is common after major trauma and is typically managed with a large-diameter chest tube to drain both the fluid and air.", "tip": "NCLEX Tip: When significant blood is expected in the chest tube output, a larger-diameter chest tube (32 Fr or greater) is typically used compared with a tube for air alone."}, {"t": "mc", "q": "A chest tube inserted primarily to evacuate air from a simple pneumothorax is generally placed:", "o": ["At the second intercostal space anteriorly, since this is the thinnest part of the chest wall with less risk to the thoracic nerve", "At the midaxillary line in the ninth intercostal space regardless of the indication", "Only in the abdomen", "There is no preferred anatomical location for pneumothorax chest tubes"], "a": [0], "e": ["", "This lower, more posterior/lateral location is more typical when significant fluid or blood also needs to be drained, not for evacuating air alone from a simple pneumothorax as described here.", "Chest tubes are placed in the thoracic cavity, not the abdomen.", "A preferred location does exist based on the indication for the tube (air alone versus air and fluid)."], "r": "A small chest tube is typically inserted near the second intercostal space for evacuating air alone in a simple pneumothorax, since this location is the thinnest part of the chest wall, minimizes risk to the thoracic nerve, and leaves a less visible scar.", "tip": "NCLEX Tip: Air rises, so a tube placed higher/more anteriorly is effective for pneumothorax; fluid/blood settles, so a tube placed lower/more posteriorly-laterally is used for effusion/hemothorax."}, {"t": "mc", "q": "When a hemothorax accompanies a pneumothorax, the chest tube used is typically:", "o": ["A very small-bore catheter (7 Fr) placed anteriorly", "A large-diameter chest tube (32 Fr or greater), often placed in the fourth or fifth intercostal space at the midaxillary line", "No chest tube is needed if blood is present", "A feeding tube inserted into the pleural space"], "a": [1], "e": ["A small-bore catheter is inadequate for draining thicker blood and clots.", "", "A chest tube is specifically needed to drain the blood and prevent complications like a retained hemothorax.", "A feeding tube is not an appropriate device for chest drainage."], "r": "When a hemothorax accompanies a pneumothorax, a large-diameter chest tube (32 Fr or greater) is typically inserted at the fourth or fifth intercostal space at the midaxillary line, directed posteriorly, to effectively drain both the fluid/blood and air.", "tip": "NCLEX Tip: Larger tube diameter is needed for blood/thick fluid because it is more viscous and prone to clot formation than air alone."}, {"t": "mc", "q": "If more than 1500 mL of blood is aspirated initially via thoracentesis or chest tube in a client with hemothorax, or output continues at more than 200 mL/hr, the nurse should anticipate:", "o": ["Discontinuing the chest tube immediately with no further action", "The need for a thoracotomy due to ongoing significant bleeding", "No change in the plan of care", "Immediate extubation regardless of respiratory status"], "a": [1], "e": ["Removing the tube does not address ongoing significant hemorrhage.", "", "This finding requires an important change (escalation) in the plan of care, not business as usual.", "Extubation status is unrelated to this specific chest tube output finding."], "r": "As a general rule, thoracotomy is considered when more than 1500 mL of blood is aspirated initially, or if chest tube output continues at a rate greater than 200 mL/hr, since this suggests ongoing significant intrathoracic bleeding that may require surgical intervention.", "tip": "NCLEX Tip: Memorize these two specific thresholds (1500 mL initial, 200 mL/hr continuing) as classic indicators for surgical intervention in traumatic hemothorax."}, {"t": "sata", "q": "Which of the following are true statements regarding tension pneumothorax? Select all that apply.", "o": ["It involves a one-way valve mechanism trapping air in the pleural space", "The trachea shifts toward the affected side", "It can be temporarily relieved by needle decompression at the second intercostal space, midclavicular line", "It causes increasing intrathoracic pressure that compresses the heart and great vessels", "It is a benign condition that resolves without any intervention"], "a": [0, 2, 3], "e": ["", "The trachea shifts AWAY from the affected side in tension pneumothorax, not toward it.", "", "", "Tension pneumothorax is a life-threatening emergency requiring immediate intervention, not a benign, self-resolving condition."], "r": "Tension pneumothorax involves a one-way valve mechanism causing progressively increasing intrathoracic pressure, tracheal shift AWAY from the affected side, and potential cardiovascular collapse; emergent needle decompression is a temporizing, life-saving intervention.", "tip": "NCLEX Tip: Always double-check tracheal shift direction on SATA/rhythm-type questions — 'away from' versus 'toward' is a very common point of confusion."}, {"t": "mc", "q": "In a chest drainage system, the collection chamber's primary function is to:", "o": ["Regulate the amount of suction applied to the chest", "Collect fluid drainage from the pleural cavity and allow measurement of output", "Prevent air from re-entering the chest", "Provide a manual high-negativity vent"], "a": [1], "e": ["Regulating suction is the function of the suction control chamber/dial, not the collection chamber.", "", "Preventing air re-entry is the function of the water-seal chamber/one-way valve.", "The manual high-negativity vent is a feature of the water-seal chamber system, not the collection chamber."], "r": "The collection chamber acts as a reservoir for fluid draining from the chest tube and is graduated to allow the nurse to measure and record drainage output over time.", "tip": "NCLEX Tip: Nurses often mark the collection chamber with date/time (e.g., at shift change) to provide a quick visual reference for drainage progression."}, {"t": "mc", "q": "The water-seal chamber in a chest drainage system functions as:", "o": ["A suction regulator", "A one-way valve that allows air and fluid to exit the pleural space but prevents them from returning", "A collection reservoir for measuring output", "A device with no clinical function"], "a": [1], "e": ["The suction regulator or suction control chamber is a separate component from the water seal.", "", "The collection chamber, not the water-seal chamber, measures drainage output.", "The water-seal chamber has a critical clinical function in preventing pneumothorax from re-forming."], "r": "The water-seal chamber (filled with 2 cm of sterile water) acts as a one-way valve, allowing air and fluid to exit the pleural space during expiration/coughing but preventing atmospheric air from moving back into the chest during inspiration.", "tip": "NCLEX Tip: Water seal = one-way valve; always maintained at the 2-cm level unless otherwise specified by the type of system in use."}, {"t": "mc", "q": "Tidaling in the water-seal chamber refers to:", "o": ["Continuous vigorous bubbling indicating a system leak", "The water level rising and falling with the respiratory cycle, reflecting pressure changes in the pleural space", "A sign that the chest tube has become completely occluded", "An indication that suction should be immediately increased"], "a": [1], "e": ["Continuous bubbling indicates an air leak, which is a distinct finding from tidaling.", "", "Complete occlusion would typically eliminate, not cause, tidaling.", "Tidaling itself is a normal, expected finding and does not automatically indicate a need to increase suction."], "r": "Tidaling refers to the water level in the water-seal chamber gently rising and falling with the respiratory cycle (up on inspiration, down on expiration for a spontaneously breathing client, often reversed with positive-pressure ventilation), reflecting normal pressure changes.", "tip": "NCLEX Tip: Tidaling confirms the tubing is patent and communicating with the pleural space; ABSENT tidaling suggests either the lung has fully re-expanded or the tubing is kinked/obstructed."}, {"t": "mc", "q": "A nurse notices continuous, vigorous bubbling in the water-seal chamber of a client's chest drainage system. This finding most likely indicates:", "o": ["Normal, expected tidaling", "An air leak in the system or at the insertion site", "The suction is turned off", "The lung has fully re-expanded"], "a": [1], "e": ["Tidaling is a gentle rise/fall with breathing, not vigorous continuous bubbling.", "", "If suction were off, this would not explain persistent bubbling from an air leak; bubbling from an air leak can occur with or without suction.", "Full lung re-expansion would be associated with absent tidaling and no ongoing air leak, not continuous bubbling."], "r": "Continuous, vigorous bubbling in the water-seal chamber indicates an air leak, either from the client's pleural space (e.g., at the insertion site) or from a loose connection somewhere in the drainage system, and requires further troubleshooting.", "tip": "NCLEX Tip: Intermittent bubbling can be a normal early finding in a pneumothorax as air is evacuated, but CONTINUOUS bubbling always warrants investigation for a leak."}, {"t": "mc", "q": "To determine whether a continuous air leak is coming from the client's insertion site versus the drainage system itself, the nurse should:", "o": ["Immediately clamp the entire chest tube for an extended period", "Briefly pinch/occlude the tubing near the chest, and if bubbling stops, the leak is on the patient's side (e.g., insertion site)", "Disconnect the tubing from the drainage unit and leave it open to air", "Increase the suction to the maximum setting"], "a": [1], "e": ["Prolonged clamping of a chest tube is dangerous, as it can lead to a tension pneumothorax if the client has an ongoing air leak; clamping is typically avoided or done only very briefly per protocol.", "", "Disconnecting the tubing and leaving it open to air introduces atmospheric air directly into the pleural space, worsening the pneumothorax.", "Increasing suction does not help identify the source of the leak and may not resolve a system-level leak."], "r": "To troubleshoot a continuous air leak, the nurse can briefly pinch or occlude the tubing near the chest (if allowed by policy); if bubbling stops, the leak is on the patient's side (e.g., the insertion site), whereas if bubbling continues, the leak is further along the tubing or in the drainage system connections.", "tip": "NCLEX Tip: Move systematically from the chest toward the device when troubleshooting — this pinch/occlude technique localizes the leak's origin."}, {"t": "mc", "q": "If the drainage system tips over accidentally, the nurse's priority actions are to:", "o": ["Discard the entire system and leave the client without a drainage system", "Set the unit upright immediately, let the fluid settle, and recheck/reconstitute the 2-cm water-seal level", "Clamp the chest tube indefinitely until a new system can be obtained", "Ignore the tip-over since it will not affect function"], "a": [1], "e": ["Discarding the system and leaving no drainage system in place would remove necessary air/fluid evacuation and could be dangerous.", "", "Prolonged clamping is generally avoided due to the risk of tension pneumothorax if there is an ongoing air leak.", "A tip-over event can disrupt the water-seal level and must be addressed, not ignored."], "r": "If a chest drainage system tips over, the nurse should set it upright immediately, allow the fluid to settle, and recheck the water-seal level, reconstituting it to 2 cm or changing the unit entirely if the seal has been compromised.", "tip": "NCLEX Tip: The water-seal level (2 cm) is the critical safety feature to reassess anytime the system's positioning or integrity is disrupted."}, {"t": "mc", "q": "If a chest tube accidentally becomes disconnected from the drainage system tubing, the nurse's immediate action should be to:", "o": ["Leave the tube open to air and call for help", "Immediately place the patient end of the tubing into a container of sterile water (~2 cm) to create a temporary water seal", "Clamp the tube permanently and do nothing further", "Reconnect the same tubing without any further assessment"], "a": [1], "e": ["Leaving the tube open to air allows atmospheric air to enter the pleural space, risking a pneumothorax.", "", "Permanent clamping without further action does not restore an appropriate drainage system and risks tension pneumothorax if an air leak is present.", "Reconnecting without assessment may reintroduce a compromised or contaminated connection."], "r": "If the chest tube becomes disconnected, the nurse should immediately submerge the patient end of the tubing about 2 cm into a container of sterile water to create a temporary water seal, preventing atmospheric air from entering the pleural space, then reconnect or change the system and notify the provider.", "tip": "NCLEX Tip: This emergency water-seal technique is a classic testable action for a disconnected chest tube — know the exact depth (~2 cm) and immediate priority."}, {"t": "mc", "q": "If a chest tube is accidentally pulled completely out of a client's chest, the nurse's priority action is to:", "o": ["Attempt to reinsert the same chest tube immediately", "Apply a sterile occlusive dressing, assess for respiratory distress, and call the provider STAT per unit protocol", "Do nothing since chest tubes are not needed once pulled", "Apply a wet, non-occlusive dressing only"], "a": [1], "e": ["A nurse should never attempt to reinsert a chest tube; this requires a provider.", "", "A pulled chest tube requires immediate action, not inaction, due to risk of pneumothorax at the open insertion site.", "A wet, non-occlusive dressing would not adequately seal the wound and prevent air from entering the pleural space."], "r": "If a chest tube is completely dislodged, the nurse should apply a sterile occlusive dressing over the insertion site, assess the client for signs of respiratory distress, and call the provider STAT, following the specific unit protocol for this emergency.", "tip": "NCLEX Tip: An occlusive (not simply absorbent) dressing is essential to prevent air from entering the open chest wound after tube dislodgement."}, {"t": "mc", "q": "A dry suction water-seal chest drainage system's suction regulator dial should typically be set at which pressure unless otherwise directed?", "o": ["-5 cm H2O", "-20 cm H2O", "-40 cm H2O", "0 cm H2O (no suction)"], "a": [1], "e": ["This is lower than the standard default setting described.", "", "This is higher than the standard default setting described, though some specific orders may call for other levels.", "Water-seal-only (no suction) is a distinct order, but the standard default suction dial setting described is -20 cm H2O."], "r": "Unless specifically directed otherwise, the dry suction regulator on a chest drainage system should be set at -20 cm H2O, which limits the maximum negative pressure delivered to the pleural space.", "tip": "NCLEX Tip: Remember that wall suction merely 'powers' the device — it is the regulator dial that actually sets and limits the true suction level delivered to the client."}, {"t": "mc", "q": "Which statement correctly distinguishes wall suction from the suction regulator dial on a dry suction water-seal chest drainage system?", "o": ["Wall suction sets the exact negative pressure delivered to the pleural space", "The regulator dial sets the actual suction level, while wall suction is simply increased until the device indicator shows adequate suction", "Wall suction and the regulator dial serve the exact same function", "The regulator dial has no impact on patient safety"], "a": [1], "e": ["Wall suction only powers the system; it does not by itself set the exact pressure delivered.", "", "These are distinct functions: wall suction is the power source, while the regulator dial is the true pressure-limiting control.", "The regulator dial's setting significantly impacts patient safety by limiting negative pressure delivered to the pleural space."], "r": "Wall suction simply provides the power to the system; the suction regulator dial actually limits and sets the true amount of negative pressure delivered to the pleural space (e.g., -20 cm H2O), so wall suction should be increased only until the device's indicator (e.g., bellows) shows adequate suction has been reached.", "tip": "NCLEX Tip: Increasing wall suction beyond what is needed to reach the indicator mark does NOT increase suction to the client — the regulator dial caps it regardless of wall suction strength."}, {"t": "mc", "q": "A nurse notes NO tidaling in a client's water-seal chamber. Which of the following should the nurse assess to determine the cause?", "o": ["Whether the client's lung has re-expanded or the tubing is kinked/obstructed", "Only the client's blood glucose level", "Only the client's temperature", "Nothing further is needed since absent tidaling is always benign"], "a": [0], "e": ["", "Blood glucose is unrelated to this respiratory system finding.", "Temperature alone does not explain absent tidaling, though infection assessment may be relevant separately.", "Absent tidaling always requires further assessment, as it could indicate either a resolved pneumothorax OR a dangerous obstruction."], "r": "Absent tidaling may indicate the lung has fully re-expanded and no longer generates pressure changes, or it may indicate an obstruction such as kinked or looped tubing; the nurse should check tubing patency, confirm water-seal level, and assess the client, obtaining a chest X-ray if ordered.", "tip": "NCLEX Tip: Never assume absent tidaling is automatically 'good news' (lung re-expanded) without ruling out an obstruction first."}, {"t": "mc", "q": "Which action should the nurse take when preparing a client with a chest drainage system for ambulation, if the client is ordered to water seal (no suction)?", "o": ["Keep the drainage system elevated above the level of the chest", "Disconnect the wall suction, and keep the device below the chest, upright, and secured to a rolling IV pole", "Clamp the chest tube for the entire duration of ambulation", "Leave the client in bed permanently to avoid any movement"], "a": [1], "e": ["The drainage system should always remain BELOW the level of the chest, not elevated above it, to allow proper gravity drainage and prevent fluid backflow.", "", "Routine clamping during ambulation is not standard practice and can be dangerous if there is an ongoing air leak.", "Ambulation is encouraged when appropriate and ordered; the client is not required to remain in bed simply because a chest tube is present."], "r": "For a client ordered to water seal only, the nurse can disconnect the wall suction for ambulation, keeping the drainage device below the level of the chest, upright, and secured to a rolling IV pole for safe mobility.", "tip": "NCLEX Tip: 'Below the chest, upright, secured' is the standard positioning rule for a chest drainage system during any activity, including ambulation and transport."}, {"t": "mc", "q": "Which bedside supplies should always be readily available for a client with a chest tube, particularly if the client is ambulating?", "o": ["Only a spare blood pressure cuff", "Sterile petroleum (Vaseline) gauze, an occlusive dressing, a new drainage system, and sterile water", "A spare set of bed linens only", "No special supplies are needed at the bedside"], "a": [1], "e": ["A blood pressure cuff alone does not address the emergency needs specific to chest tube complications.", "", "Bed linens alone do not address emergency chest tube needs.", "Specific supplies must be readily available in case of accidental tube dislodgement or system disconnection, especially during ambulation."], "r": "Bedside supplies for any client with a chest tube should include sterile petroleum (Vaseline) gauze, an occlusive dressing, a new drainage system, and sterile water, since accidental tube removal or disconnection can happen anywhere the client is, including during ambulation.", "tip": "NCLEX Tip: If a client with a chest tube is ambulating, these supplies should be placed in a bag and attached to the IV pole for immediate access if an emergency occurs."}, {"t": "mc", "q": "Which type of chest drainage system uses a one-way mechanical valve instead of a water seal, making it useful in emergency situations and for ambulatory clients?", "o": ["Traditional water-seal (wet suction) system", "Dry suction water-seal system", "Dry suction one-way valve system", "There is no such system available"], "a": [2], "e": ["The traditional water-seal system requires fluid in both the water-seal and suction control chambers.", "The dry suction water-seal system still uses a water-filled water-seal chamber, unlike a true one-way valve system.", "", ""], "r": "The dry suction one-way valve system uses a one-way mechanical valve rather than a water seal, allowing it to be set up quickly in emergencies and to continue working even if knocked over, making it especially useful for ambulatory clients.", "tip": "NCLEX Tip: Compare the three system types: traditional water seal (wet suction), dry suction water seal, and dry suction one-way valve — know the advantages/disadvantages of each."}, {"t": "mc", "q": "A traditional (wet suction) water-seal chest drainage system differs from a dry suction water-seal system primarily in that the traditional system:", "o": ["Requires sterile fluid to be instilled in both the water-seal chamber and a wet suction control chamber", "Never requires any fluid at all", "Uses a mechanical dial instead of fluid to set suction", "Cannot be used with a suction source"], "a": [0], "e": ["", "The traditional water-seal system does require fluid, both in the water seal and the suction control chamber.", "This describes the dry suction water-seal system's regulator, not the traditional wet suction system.", "The traditional system can be connected to a suction source to add additional negative pressure."], "r": "A traditional (wet suction) water-seal system requires sterile fluid to be instilled into both the water-seal chamber and the wet suction control chamber, with the amount of suction determined by the height of the water column in the suction chamber.", "tip": "NCLEX Tip: In a wet suction system, MORE bubbling in the suction chamber indicates the suction is turned up higher, not a leak — this differs from bubbling in the water-seal chamber, which indicates an air leak."}, {"t": "mc", "q": "A one-way (Heimlich) valve chest drainage system is most appropriate for a client who:", "o": ["Requires a full water-seal and suction system due to expected large-volume drainage", "Has had a chest tube inserted to re-expand a lung after pneumothorax with minimal expected fluid drainage", "Needs continuous high-volume suction for a large hemothorax", "Should never be allowed to ambulate"], "a": [1], "e": ["Large-volume expected drainage would more appropriately use a standard collection chamber system.", "", "A Heimlich valve is not designed for high-volume suction management of a large hemothorax.", "A one-way valve system is actually advantageous for ambulatory clients due to its portability."], "r": "A one-way (Heimlich) valve may be connected to a chest tube inserted to re-expand a lung after pneumothorax when very little fluid drainage is expected, and it may be attached to a collection bag or covered with a sterile dressing if no drainage is anticipated.", "tip": "NCLEX Tip: The Heimlich valve is a lightweight, portable option ideal for pneumothorax management with minimal expected fluid output."}, {"t": "mc", "q": "Prior to initial chest drainage system setup at the bedside, the nurse's first step should be:", "o": ["Connect wall suction immediately before verifying the order", "Perform hand hygiene and verify the order for suction versus water seal only, including the target pressure", "Apply the occlusive dressing before filling the water-seal chamber", "Skip filling the water-seal chamber if using any type of system"], "a": [1], "e": ["Verifying the order should occur before connecting suction, not after.", "", "The occlusive dressing is applied later in the setup sequence, after confirming a properly functioning, connected system.", "The water-seal chamber must be filled per the specific system type; only certain dry suction regulators do not require this step."], "r": "Initial chest drainage system setup begins with hand hygiene and verifying the specific order (suction versus water seal only, and the target pressure such as -10/-20/-40 cm H2O), before proceeding to fill the water-seal chamber and connect tubing.", "tip": "NCLEX Tip: Always verify the specific order details (suction level, water seal only) before beginning setup — chest tube orders can vary significantly by client and indication."}, {"t": "mc", "q": "When setting up a chest drainage system, why must the collection unit always be kept below the level of the client's chest?", "o": ["To allow gravity to promote drainage and prevent fluid from flowing backward into the pleural space", "It has no clinical significance and is only for convenience", "To increase the suction pressure automatically", "To prevent the client from being able to see the drainage"], "a": [0], "e": ["", "Positioning below the chest has significant clinical significance for safe, effective drainage.", "Positioning does not automatically increase suction pressure; the regulator dial controls that.", "Visibility of the drainage is not the rationale for this positioning rule."], "r": "Keeping the chest drainage unit below the level of the client's chest allows gravity to promote fluid drainage from the pleural space and helps prevent drainage or contaminated fluid from flowing backward into the chest.", "tip": "NCLEX Tip: 'Below the chest, upright' should be checked and maintained at all times — during repositioning, transport, and ambulation alike."}, {"t": "mc", "q": "A nurse assesses a client's chest tube dressing and finds subcutaneous emphysema (crepitus) around the insertion site. This finding indicates:", "o": ["Air has tracked into the subcutaneous tissue surrounding the insertion site", "The client has developed a life-threatening arrhythmia", "The chest tube has been successfully removed", "The dressing needs no further monitoring"], "a": [0], "e": ["", "Crepitus reflects subcutaneous air, not a cardiac arrhythmia.", "Crepitus does not indicate tube removal; the tube is still in place with this finding.", "New or worsening subcutaneous emphysema requires ongoing monitoring and provider notification if it progresses."], "r": "Subcutaneous emphysema (crepitus) occurs when air escapes from the pleural space or lung and tracks into the subcutaneous tissue, producing a crackling sensation on palpation; the nurse should monitor this finding for progression and report significant increases.", "tip": "NCLEX Tip: Mild, stable subcutaneous emphysema is often monitored, but RAPIDLY EXPANDING subcutaneous emphysema is an indication to call the provider emergently."}, {"t": "mc", "q": "Which chest tube drainage finding should prompt the nurse to notify the provider emergently?", "o": ["Serosanguineous drainage totaling 75 mL over 8 hours", "Sudden increase in drainage exceeding 150-200 mL/hr, or a new bright-red surge in output", "Slight tidaling present with no other abnormal findings", "A dressing that is clean, dry, and intact"], "a": [1], "e": ["This modest drainage total over 8 hours is within a reassuring, expected range for many post-surgical clients.", "", "Tidaling with no other abnormal findings is a reassuring sign of proper system function.", "A clean, dry, intact dressing is a reassuring, expected finding."], "r": "A sudden increase in chest tube drainage (e.g., exceeding 150-200 mL/hr in an adult, or per unit-defined threshold), a new bright-red surge in output after previous stabilization, or new clots blocking flow are all reasons to notify the provider emergently.", "tip": "NCLEX Tip: Memorize the numeric threshold (150-200 mL/hr) as a common, specific NCLEX detail for chest tube output requiring urgent notification."}, {"t": "mc", "q": "Which of the following chest tube findings would require the nurse to call the provider emergently?", "o": ["Mild, stable subcutaneous emphysema noted at the last two assessments", "New or worsening respiratory distress, tracheal deviation, and hypoxia", "Serosanguineous drainage that has decreased slightly over the shift", "A properly functioning suction indicator at the manufacturer's mark"], "a": [1], "e": ["Stable, non-progressing subcutaneous emphysema is generally monitored rather than an automatic emergent trigger.", "", "Decreasing drainage over a shift is often a reassuring trend, not an emergent concern.", "A properly functioning suction indicator is a reassuring finding."], "r": "New or worsening respiratory distress, tracheal deviation, hypoxia, or rapidly expanding subcutaneous emphysema are all findings requiring the nurse to notify the provider emergently, as they may indicate a significant complication such as tension pneumothorax.", "tip": "NCLEX Tip: Any sign suggesting the pneumothorax is worsening despite chest tube placement (tracheal shift, worsening hypoxia) should be treated as an emergency."}, {"t": "mc", "q": "Which nursing action related to chest tube management is explicitly discouraged unless specifically directed by the provider?", "o": ["Assessing the insertion site every shift", "Milking or stripping the chest tubing", "Coiling excess tubing on the bed with a gentle slope toward the drainage unit", "Ensuring the system remains upright and below the chest"], "a": [1], "e": ["Regular site assessment is an expected, appropriate nursing action.", "", "Proper tubing management, including coiling with a gentle slope, is an appropriate and recommended action.", "Maintaining proper system position is an appropriate, expected action."], "r": "Milking or stripping chest tubing is generally discouraged unless specifically directed by the provider, since this practice can create dangerously high negative pressure within the pleural space and cause tissue damage.", "tip": "NCLEX Tip: 'No milking/stripping (unless provider-directed)' is a specific, testable safety detail for ongoing chest tube care."}, {"t": "mc", "q": "Which of the following is an appropriate finding to document for a client's chest drainage system every shift?", "o": ["Only the client's favorite beverage", "Type/location of the tube, suction setting, water-seal level, drainage characteristics/amount, and presence of tidaling or air leak", "Only the time the tube was originally inserted, with no other ongoing details", "Documentation is not necessary if the system appears to be functioning normally"], "a": [1], "e": ["This is unrelated to chest tube assessment documentation.", "", "A single historical detail does not capture the ongoing shift assessment needed.", "Documentation is required each shift and with any changes, regardless of whether the system currently appears to be functioning normally."], "r": "Complete chest drainage system documentation each shift should include the type/location of the tube, system type, suction setting and device indicator status, water-seal level and system position, respiratory assessment, tidaling/air-leak status, and drainage color/character/amount with cumulative total.", "tip": "NCLEX Tip: A thorough shift assessment and documentation habit supports early detection of complications and continuity of care across the team."}, {"t": "mc", "q": "Before chest tube removal, which of the following is part of appropriate pre-removal preparation?", "o": ["Administering prescribed analgesic or sedation 30-60 minutes before the procedure", "Positioning the client supine and flat with the head of the bed lowered", "Withholding all information about the procedure from the client to reduce anxiety", "Skipping baseline respiratory assessment since the tube is being removed"], "a": [0], "e": ["", "Positioning in semi-Fowler's or high-Fowler's position (not flat/supine) is recommended for optimal lung expansion and comfort.", "Explaining the procedure to the client in age-appropriate language actually helps reduce anxiety and should not be withheld.", "A baseline respiratory assessment is an essential pre-removal step, not something to skip."], "r": "Pre-removal preparation for chest tube removal includes verifying the provider's order for clinical readiness, explaining the procedure to the client, administering prescribed analgesic or sedation 30-60 minutes prior, gathering supplies, positioning the client in semi-Fowler's or high-Fowler's position, and performing a baseline assessment.", "tip": "NCLEX Tip: Adequate pain control given ahead of time (30-60 minutes prior) supports a smoother, less distressing chest tube removal experience."}, {"t": "mc", "q": "Which clinical readiness criteria should be verified before chest tube removal?", "o": ["The lung has re-expanded, drainage is minimal, there is no air leak, and the client's respiratory status is stable", "The client has a fever and increasing drainage", "There is a persistent air leak with worsening respiratory status", "The lung remains collapsed with ongoing significant drainage"], "a": [0], "e": ["", "Fever and increasing drainage would suggest a complication, not readiness for removal.", "A persistent air leak with worsening status indicates the tube is still needed, not that it is ready for removal.", "A collapsed lung with ongoing drainage indicates continued need for the chest tube, not readiness for removal."], "r": "Clinical readiness for chest tube removal includes evidence that the lung has re-expanded, drainage has become minimal, there is no ongoing air leak, and the client's respiratory status is stable.", "tip": "NCLEX Tip: All four readiness criteria (re-expansion, minimal drainage, no air leak, stable respiratory status) should be present before removal is considered appropriate."}, {"t": "mc", "q": "During chest tube removal, the nurse instructs the client to take a deep breath and hold it, or perform a Valsalva maneuver. What is the purpose of this instruction?", "o": ["To decrease intrathoracic pressure and allow air to enter the pleural space", "To increase intrathoracic pressure and prevent air from entering the pleural space during tube withdrawal", "To distract the client from the pain of the procedure only", "This instruction serves no physiologic purpose"], "a": [1], "e": ["This instruction is intended to increase, not decrease, intrathoracic pressure.", "", "While it may also provide some distraction, the primary physiologic purpose is increasing intrathoracic pressure to prevent air entry.", "This instruction has a specific, important physiologic purpose."], "r": "Having the client take a deep breath and hold it (or perform a Valsalva maneuver) during chest tube removal increases intrathoracic pressure, which helps prevent atmospheric air from being drawn into the pleural space as the tube is withdrawn.", "tip": "NCLEX Tip: Timing matters — the occlusive dressing must be applied immediately as the tube is withdrawn, right after this breath-holding maneuver, to seal the site."}, {"t": "mc", "q": "Immediately after chest tube removal, what should the nurse do as the tube is withdrawn?", "o": ["Wait several minutes before applying any dressing", "Immediately apply a sterile occlusive dressing and secure it with airtight tape on all sides", "Leave the site open to air to promote healing", "Apply only a single strip of tape loosely over the site"], "a": [1], "e": ["Delaying dressing application risks air entry into the pleural space through the open site.", "", "Leaving the site open to air after tube removal risks introducing atmospheric air into the pleural space and infection at the open wound.", "A single loose strip of tape does not create the airtight seal needed to prevent air entry."], "r": "As the chest tube is withdrawn, the nurse should immediately apply a sterile occlusive dressing and secure it with airtight tape on all sides to prevent air from entering the pleural space through the now-open insertion site.", "tip": "NCLEX Tip: An occlusive, airtight seal applied at the exact moment of removal is critical to prevent a new pneumothorax from forming."}, {"t": "mc", "q": "How frequently should the nurse assess respiratory status during the first 1-2 hours after chest tube removal?", "o": ["Every 15-30 minutes", "Once, at the end of the shift", "Only if the client reports symptoms", "Every 8 hours"], "a": [0], "e": ["", "Waiting until the end of the shift is far too infrequent for this early, higher-risk period.", "Proactive, scheduled assessment is needed regardless of whether the client reports symptoms, since early complications may not always be immediately obvious to the client.", "This interval is far too infrequent for the critical early post-removal period."], "r": "Respiratory status (rate, depth, effort, breath sounds, oxygen saturation, dyspnea, chest pain) should be assessed every 15-30 minutes for the first 1-2 hours after chest tube removal, then per facility policy, to promptly detect any signs of recurrent pneumothorax.", "tip": "NCLEX Tip: The first 1-2 hours after chest tube removal are the highest-risk window for recurrent pneumothorax — frequent assessment during this time is essential."}, {"t": "mc", "q": "Which finding after chest tube removal would most concern the nurse for a recurrent pneumothorax?", "o": ["Stable respiratory rate and clear bilateral breath sounds", "Decreased breath sounds on the affected side, restlessness, tachypnea, or cyanosis", "A clean, dry, intact dressing at the former insertion site", "The client performing incentive spirometry without difficulty"], "a": [1], "e": ["This is a normal, reassuring finding.", "", "This is a reassuring finding.", "This is a reassuring finding demonstrating good respiratory effort."], "r": "Decreased breath sounds on the affected side, along with restlessness, tachypnea, or cyanosis after chest tube removal, are signs of a possible recurrent pneumothorax and should be reported to the provider promptly.", "tip": "NCLEX Tip: A post-removal chest X-ray, if ordered, helps confirm lung re-expansion and rule out a recurrent pneumothorax."}, {"t": "sata", "q": "Which of the following are appropriate elements of patient/family teaching for a client with a chest tube? Select all that apply.", "o": ["Keep the drainage box below the level of the chest at all times", "Pull or reposition the tubing freely as needed for comfort", "Call for help before getting out of bed", "Take pain medicine before activity or dressing changes", "Report any gentle bubbling or fluid movement in the system immediately as an emergency"], "a": [0, 2, 3], "e": ["", "Clients and families should be taught NOT to pull or manipulate the tubing, as this can cause dislodgement or injury.", "", "", "Gentle bubbling/fluid movement is often an expected, normal finding that staff will monitor; it does not need to be treated by the family as an automatic emergency, though any concerning changes should be reported."], "r": "Appropriate teaching includes keeping the drainage system below chest level, avoiding pulling/manipulating tubing, calling for help before getting out of bed, and taking pain medicine proactively before activity; families should understand that some gentle bubbling or fluid movement is expected and monitored by staff, rather than assuming it is automatically an emergency.", "tip": "NCLEX Tip: Effective teach-back should distinguish between expected findings (gentle bubbling, fluid movement) and true warning signs (tugging pain, tube coming out, sudden severe symptoms) that must be reported immediately."}, {"t": "bowtie", "q": "A client with a chest tube connected to a dry suction water-seal drainage system suddenly develops worsening shortness of breath, tachypnea, and decreased breath sounds on the affected side. The nurse notes the water-seal chamber shows continuous vigorous bubbling that was not previously present.", "conditionOptions": ["Resolving pneumothorax with lung re-expansion", "A new or worsening air leak with possible clinical deterioration", "Simple hemothorax with no air component", "Expected, normal system function requiring no action"], "correctCondition": 1, "conditionExplain": ["A resolving pneumothorax would be expected to show absent, not continuous new, bubbling along with improving (not worsening) respiratory status.", "", "A hemothorax without an air component would not be expected to cause new continuous bubbling in the water-seal chamber.", "Continuous new bubbling combined with worsening respiratory status is abnormal and requires prompt action, not simply routine monitoring."], "actions": ["Systematically troubleshoot the source of the leak (pinch near the chest, then move along tubing)", "Immediately remove the chest tube without further assessment", "Notify the provider promptly of the client's respiratory change", "Increase wall suction to the maximum setting to try to resolve the leak on its own", "Assess the client's respiratory status, including oxygen saturation and breath sounds"], "correctActions": [0, 2], "actionsExplain": ["", "A nurse should never remove a chest tube independently, especially with worsening respiratory status.", "", "Simply maximizing suction does not address a structural leak and is not the recommended troubleshooting approach.", "This is an appropriate action, but the priority actions specifically requested here are troubleshooting the leak source and notifying the provider given the acuity of the change."], "monitor": ["Respiratory rate, depth, and oxygen saturation trends", "Water-seal level and evidence of ongoing air leak", "Blood glucose every 30 minutes", "Recent bowel sound assessment"], "correctMonitor": [0, 1], "monitorExplain": ["", "", "Blood glucose monitoring is not indicated by this respiratory/chest tube scenario.", "Bowel sounds are not the priority monitoring parameter in this scenario."], "r": "New continuous bubbling with worsening respiratory status suggests a new or worsening air leak and possible clinical deterioration. Priority actions are to systematically troubleshoot the leak's source and notify the provider, while closely monitoring respiratory status and the water-seal/air-leak findings.", "tip": "NCLEX Tip: A change from previously stable to newly continuous bubbling, paired with new symptoms, should always be treated with urgency rather than assumed to be routine.", "actionsCount": 2, "monitorCount": 2}, {"t": "mc", "q": "Pleural effusion is best defined as:", "o": ["An abnormal collection of air in the pleural space", "An abnormal collection of fluid in the pleural space", "A normal finding with no clinical significance", "A collection of pus specifically located within the lung parenchyma"], "a": [1], "e": ["This describes a pneumothorax, not a pleural effusion.", "", "A pleural effusion is an abnormal, clinically significant finding, not a normal one.", "This describes an empyema located specifically in the pleural space, not lung parenchyma, and effusion more broadly can involve various types of fluid, not only pus."], "r": "Pleural effusion is a collection of fluid in the pleural space that is rarely a primary disease process; it is usually secondary to other conditions such as heart failure, pneumonia, malignancy, or pulmonary embolism.", "tip": "NCLEX Tip: Because pleural effusion is usually secondary, always consider and address the underlying cause (e.g., heart failure, malignancy) as part of the overall treatment plan."}, {"t": "mc", "q": "A transudative pleural effusion most commonly results from which condition?", "o": ["Bacterial pneumonia with inflammation", "Heart failure", "Malignant tumor invasion of the pleura", "Tuberculosis"], "a": [1], "e": ["Bacterial pneumonia and inflammation are more classically associated with an exudative effusion.", "", "Malignancy is a classic cause of an exudative, not transudative, effusion.", "Tuberculosis is more classically associated with an exudative effusion."], "r": "A transudative pleural effusion (filtrate of plasma crossing intact capillary walls) most commonly results from imbalances in hydrostatic or oncotic pressures, with heart failure being the most common cause, and generally implies the pleural membranes themselves are not diseased.", "tip": "NCLEX Tip: Transudate = 'plumbing problem' (pressure imbalance, e.g., heart failure); Exudate = 'inflammation/disease problem' (infection, malignancy, inflammation of the pleura itself)."}, {"t": "mc", "q": "An exudative pleural effusion typically results from which mechanism?", "o": ["A simple pressure imbalance across intact capillary walls", "Inflammation from bacterial products or tumors involving the pleural surfaces", "Normal, expected fluid shifts with no underlying disease", "Dehydration alone"], "a": [1], "e": ["This describes the mechanism of a transudative effusion, not an exudative one.", "", "An exudative effusion by definition results from an underlying disease process, not a normal fluid shift.", "Dehydration is not the classic mechanism behind an exudative pleural effusion."], "r": "An exudate results from extravasation of fluid into the pleural space caused by inflammation from bacterial products or tumors involving the pleural surfaces, distinguishing it from a transudate caused by simple pressure imbalances.", "tip": "NCLEX Tip: Pleural fluid analysis (protein, LDH, cell counts) helps distinguish transudate from exudate — a foundational diagnostic concept related to pleural effusion."}, {"t": "mc", "q": "Which diagnostic and treatment procedure removes fluid from the pleural space, obtains a specimen for analysis, and relieves dyspnea from a pleural effusion?", "o": ["Bronchoscopy", "Thoracentesis", "Colonoscopy", "Lumbar puncture"], "a": [1], "e": ["Bronchoscopy visualizes the airways and does not primarily drain pleural fluid.", "", "Colonoscopy is unrelated to the pleural space.", "Lumbar puncture samples cerebrospinal fluid, unrelated to pleural effusion."], "r": "Thoracentesis is performed to remove pleural fluid, obtain a specimen for analysis, and relieve dyspnea and respiratory compromise caused by a pleural effusion; it may be performed under ultrasound guidance.", "tip": "NCLEX Tip: Post-thoracentesis, monitor closely for signs of pneumothorax (a known potential complication of the procedure)."}, {"t": "mc", "q": "On assessment, a client with a large pleural effusion would be most likely to exhibit which finding?", "o": ["Hyperresonant percussion with increased breath sounds", "A dull-to-flat percussion note, decreased or absent breath sounds, and possible tracheal deviation away from the affected side", "Normal vesicular breath sounds throughout with no other findings", "Stridor heard on inspiration only"], "a": [1], "e": ["Hyperresonant percussion is more typical of pneumothorax, not a large fluid-filled effusion.", "", "A large pleural effusion produces significant abnormal, not entirely normal, findings.", "Stridor reflect
