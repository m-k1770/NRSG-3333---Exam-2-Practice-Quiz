 injuries.", "tip": "NCLEX Tip: Match dressing choice to drainage amount: transparent film/hydrocolloid for minimal drainage; foam/alginate for moderate-to-heavy drainage."}, {"t": "mc", "q": "A hydrocolloid dressing is particularly useful for which type of wound?", "o": ["A heavily infected wound requiring frequent visual inspection", "A partial-thickness wound with mild-to-moderate drainage, providing a moist healing environment and some cushioning", "An actively bleeding wound requiring hemostatic pressure", "A wound requiring daily debridement with wet-to-dry technique"], "a": [1], "e": ["Hydrocolloid dressings are generally not recommended for heavily infected wounds, since their occlusive nature can trap bacteria.", "", "Hydrocolloids are not designed as hemostatic dressings for actively bleeding wounds.", "Hydrocolloids maintain a moist environment for autolytic debridement, distinct from the mechanical debridement action of wet-to-dry dressings."], "r": "Hydrocolloid dressings form a gel as they absorb wound exudate, providing a moist healing environment and some cushioning, and are useful for partial-thickness wounds with mild-to-moderate drainage, including some pressure injuries.", "tip": "NCLEX Tip: Hydrocolloids support autolytic debridement (using the body's own enzymes and moisture) rather than the mechanical debridement seen with wet-to-dry dressings."}, {"t": "mc", "q": "Wet-to-dry dressing changes work by which mechanism?", "o": ["Maintaining a consistently moist wound environment at all times", "Allowing the moist gauze to dry and adhere to necrotic tissue and debris, which is then mechanically removed when the dressing is changed", "Preventing any contact between the dressing and the wound bed", "Eliminating the need for any pain management during dressing changes"], "a": [1], "e": ["Wet-to-dry dressings specifically transition from moist to dry, unlike dressings designed to maintain constant moisture.", "", "Wet-to-dry dressings are placed directly against the wound bed.", "Wet-to-dry dressing changes can be quite painful due to the mechanical debridement effect and typically require analgesia beforehand."], "r": "Wet-to-dry dressings involve applying moist gauze to a wound, allowing it to dry and adhere to necrotic tissue and debris, which is then mechanically removed (debrided) when the dressing is changed, though this method can be painful and non-selective in removing both healthy and unhealthy tissue.", "tip": "NCLEX Tip: Premedicate clients with analgesia before wet-to-dry dressing changes due to the significant pain associated with this mechanical debridement technique."}, {"t": "mc", "q": "Which of the following describes negative pressure wound therapy's (wound VAC's) impact on wound size over time?", "o": ["The wound size typically remains completely unchanged throughout therapy", "The wound gradually shrinks in size as granulation tissue fills in and the foam dressing is adjusted/reduced at each change", "The wound always increases in size during therapy", "Wound size cannot be assessed during wound VAC therapy"], "a": [1], "e": ["Wound VAC therapy is specifically intended to promote healing and size reduction, not maintain an unchanged wound.", "", "An increasing wound size during appropriate therapy would be an unexpected, concerning finding rather than the expected outcome.", "Wound size and other characteristics can and should be assessed and documented at each dressing change."], "r": "As negative pressure wound therapy promotes granulation tissue formation and wound contraction, the wound gradually shrinks in size, and the foam dressing is adjusted or reduced to match at each scheduled dressing change.", "tip": "NCLEX Tip: Document wound dimensions (length, width, depth) at each wound VAC dressing change to objectively track healing progress over time."}, {"t": "mc", "q": "Which finding during a wound VAC dressing change would be MOST concerning and require provider notification?", "o": ["Beefy red, moist granulation tissue filling the wound bed", "A sudden increase in bright red blood in the canister/tubing", "A gradual decrease in wound size compared to the prior dressing change", "Mild, expected discomfort during the dressing change"], "a": [1], "e": ["This is a healthy, reassuring finding indicating good healing progress.", "", "This is a reassuring finding indicating the therapy is working as intended.", "Mild, expected discomfort can often be managed with premedication and is not itself an emergent concern."], "r": "A sudden increase in bright red blood in the wound VAC canister or tubing is concerning for active bleeding and requires prompt provider notification, as this could indicate erosion into a blood vessel or other significant complication.", "tip": "NCLEX Tip: Any sudden change in wound VAC drainage character (especially fresh, bright red blood) should be treated as a priority safety concern."}, {"t": "mc", "q": "Which of the following is an appropriate nursing consideration before applying a moisture barrier cream to an area at risk for incontinence-associated skin damage?", "o": ["Applying the cream over visibly soiled skin without cleansing first", "Gently cleansing and drying the skin first, then applying a thin, even layer of the barrier cream", "Applying the cream only once per week regardless of incontinence frequency", "Using a thick, occlusive layer of cream without any skin cleansing"], "a": [1], "e": ["Applying cream over soiled skin without cleansing first traps irritants against the skin and reduces the effectiveness of the barrier product.", "", "Application frequency should be based on the client's incontinence pattern, not a fixed weekly schedule regardless of need.", "Skin should be cleansed before application of the barrier cream, regardless of how thick the layer applied."], "r": "Proper incontinence skin care involves gently cleansing and drying the skin after each incontinence episode before applying a thin, even layer of a moisture barrier cream to protect the skin from further irritation and breakdown.", "tip": "NCLEX Tip: 'Cleanse, dry, then protect' is a simple, testable sequence for incontinence-associated skin care."}, {"t": "sata", "q": "Which of the following dressing types are generally appropriate for a wound with heavy drainage? Select all that apply.", "o": ["Alginate dressing", "Foam dressing", "Transparent film dressing alone", "Highly absorbent composite dressing", "A simple adhesive bandage"], "a": [0, 1, 3], "e": ["", "", "A transparent film alone has minimal absorptive capacity and is not appropriate for heavy drainage.", "", "A simple adhesive bandage has minimal absorptive capacity and is inappropriate for heavy drainage."], "r": "Alginate, foam, and highly absorbent composite dressings are all appropriate choices for wounds with heavy drainage, since they can absorb significant exudate, while transparent films and simple adhesive bandages lack sufficient absorptive capacity for this purpose.", "tip": "NCLEX Tip: When a SATA question asks about heavy drainage, favor dressings specifically designed for high absorbency (foam, alginate, composite) over minimally absorptive options (film, simple bandage)."}, {"t": "mc", "q": "A client with a chronic venous leg ulcer is being taught about compression therapy. Which statement by the client indicates correct understanding?", "o": ["\"Compression therapy will decrease blood flow to my leg and should be avoided.\"", "\"Compression therapy helps improve venous return and reduce edema, supporting healing of my venous ulcer.\"", "\"I should remove the compression wrap only right before I go to bed and reapply first thing when I wake up, with no exceptions ever discussed with my provider.\"", "\"Compression therapy is only used for arterial ulcers, not venous ulcers.\""], "a": [1], "e": ["Compression therapy is specifically intended to improve, not impair, venous blood flow/return in the affected leg.", "", "Specific wearing schedules should be individualized and discussed with the provider; a rigid statement with 'no exceptions ever discussed' oversimplifies proper, individualized compression therapy teaching.", "Compression therapy is used for venous, not arterial, insufficiency; arterial ulcers require improved arterial blood flow, and compression is generally contraindicated with significant arterial insufficiency."], "r": "Compression therapy for venous ulcers helps improve venous return, reduce edema, and support the venous ulcer healing process, and is an evidence-based cornerstone of chronic venous ulcer management.", "tip": "NCLEX Tip: Assess arterial status (e.g., ankle-brachial index) before applying compression therapy, since compression can be dangerous in a client with significant arterial insufficiency."}, {"t": "mc", "q": "Which characteristic would the nurse expect to find with an arterial (ischemic) leg ulcer, as opposed to a venous ulcer?", "o": ["A shallow ulcer with irregular borders, moderate drainage, and located near the medial malleolus", "A deep, well-defined ulcer often located on the toes or lateral malleolus, with pale wound base and diminished pulses", "Significant edema and brownish skin discoloration surrounding the wound", "A wound that improves significantly with leg elevation"], "a": [1], "e": ["This description is more classic for a venous ulcer, not an arterial ulcer.", "", "Significant edema and brown discoloration are more classic venous ulcer findings.", "Arterial ulcers often worsen, not improve, with leg elevation, since elevation further reduces already-compromised arterial blood flow."], "r": "Arterial (ischemic) ulcers are typically deep, well-defined wounds located on the toes, heels, or lateral malleolus, with a pale wound base, diminished or absent pulses, and pain that often worsens with elevation, contrasting with venous ulcers.", "tip": "NCLEX Tip: Elevating the legs helps venous ulcers (improves venous return) but can worsen arterial ulcers (further reduces arterial flow) — know this key difference in positioning guidance."}, {"t": "mc", "q": "Which of the following best reflects an appropriate nursing intervention for a client with a diabetic foot ulcer?", "o": ["Encouraging the client to continue full weight-bearing on the affected foot without any offloading", "Assessing and addressing pressure offloading, blood glucose control, and regular wound/foot assessment", "Avoiding any glucose control measures since they are unrelated to wound healing", "Discouraging routine foot inspection since it may cause unnecessary anxiety"], "a": [1], "e": ["Continued full weight-bearing on a diabetic foot ulcer without offloading can worsen the wound and delay healing; pressure offloading (e.g., special footwear) is an important intervention.", "", "Blood glucose control has a well-documented, significant impact on wound healing and infection risk in diabetic clients.", "Regular foot inspection is a key preventive and monitoring strategy for clients with diabetes and should be actively encouraged, not discouraged."], "r": "Comprehensive care for a diabetic foot ulcer includes pressure offloading (special footwear or devices), optimizing blood glucose control, and regular wound/foot assessment, since impaired circulation and neuropathy in diabetes significantly affect healing and risk of complications.", "tip": "NCLEX Tip: Diabetic foot ulcers require a multi-pronged approach — glycemic control, offloading, and infection prevention/monitoring — rather than any single intervention alone."}, {"t": "mc", "q": "Which sign would suggest a wound infection has progressed to a more serious systemic concern, such as early sepsis?", "o": ["Localized redness only, with a normal temperature and stable vital signs", "Fever, tachycardia, and altered mental status in addition to local wound changes", "Mild, stable serous drainage with no other findings", "A slightly warm wound edge with no other systemic symptoms"], "a": [1], "e": ["This describes a stable, localized finding, not systemic concern.", "", "This is a reassuring, localized finding without systemic involvement.", "A mild, isolated local finding without systemic signs does not by itself suggest sepsis."], "r": "Systemic signs such as fever, tachycardia, and altered mental status, occurring alongside local wound changes, suggest the infection may be progressing toward a systemic response (sepsis) and require prompt escalation of care, including likely blood cultures and antibiotics.", "tip": "NCLEX Tip: Always assess for SYSTEMIC signs (fever, tachycardia, altered mentation, hypotension) in addition to local wound findings — systemic involvement changes the urgency of the response significantly."}, {"t": "fib", "q": "Fill in the blank: The type of pressure injury in which the wound bed is completely covered by slough or eschar, preventing accurate staging, is called an ______ pressure injury.", "blanks": [["unstageable", "Unstageable"]], "r": "An unstageable pressure injury has full-thickness tissue loss obscured by slough or eschar, meaning the true depth cannot be determined until sufficient debridement occurs to visualize the wound bed.", "tip": "NCLEX Tip: Do not attempt to assign a numeric stage to a wound covered in slough/eschar — it must be documented specifically as 'unstageable' until the wound bed can be visualized."}, {"t": "mc", "q": "A client's wound bed appears beefy red, moist, and granular in texture. This finding indicates:", "o": ["Necrotic (dead) tissue requiring immediate debridement", "Healthy granulation tissue, a positive sign of wound healing progress", "A sign of significant infection requiring antibiotics", "A wound that has failed to make any healing progress"], "a": [1], "e": ["Necrotic tissue typically appears black, brown, or grayish, not beefy red and moist.", "", "Beefy red, moist granulation tissue is a reassuring finding, not, by itself, evidence of infection.", "This is a positive, reassuring finding indicating good healing progress, not a lack of progress."], "r": "Beefy red, moist granulation tissue is a healthy sign of wound healing progress, reflecting good blood supply and new tissue formation during the proliferative phase of wound healing.", "tip": "NCLEX Tip: Learn to recognize the appearance of healthy granulation tissue (beefy red, moist) versus concerning findings (pale/dusky granulation, necrotic black/brown eschar, or yellow/tan slough)."}, {"t": "mc", "q": "Which wound bed tissue type is described as yellow, tan, or white, stringy or mucinous in texture, and generally needs to be removed (debrided) to promote healing?", "o": ["Granulation tissue", "Slough", "Epithelial tissue", "Eschar"], "a": [1], "e": ["Granulation tissue is a healthy, beefy red tissue type, not the yellow/tan tissue described.", "", "Epithelial tissue is typically pink/pearly and represents new skin at the wound edges, not the yellow/tan description given.", "Eschar is typically black, brown, or tan and hard/leathery, not the softer, stringy texture described here."], "r": "Slough is non-viable tissue that is typically yellow, tan, or white, and stringy or mucinous in texture; it generally needs to be debrided (removed) because it can harbor bacteria and impede the wound healing process.", "tip": "NCLEX Tip: Slough (soft, yellow/tan, stringy) and eschar (hard, black/brown, leathery) are both types of non-viable tissue but differ significantly in texture and appearance."}, {"t": "mc", "q": "Eschar is best described as:", "o": ["Healthy, new pink epithelial tissue at the wound edges", "Hard, leathery, black, brown, or tan necrotic tissue that generally requires debridement", "Beefy red granulation tissue indicating active healing", "A type of surgical dressing material"], "a": [1], "e": ["This describes healthy epithelial tissue, not eschar.", "", "This describes healthy granulation tissue, not eschar.", "Eschar is a tissue finding, not a dressing material."], "r": "Eschar is hard, leathery, necrotic tissue that is typically black, brown, or tan in color and generally requires debridement, since it can obscure the true wound bed and impair healing (and is the finding that makes a pressure injury 'unstageable').", "tip": "NCLEX Tip: Stable, dry, adherent eschar on an ischemic limb (such as a heel) may sometimes be intentionally left in place per protocol as a protective 'biological dressing' rather than debrided — always follow the specific order/protocol."}, {"t": "mc", "q": "Which of the following best describes epithelial tissue in the context of wound healing?", "o": ["Black, hard, leathery necrotic tissue", "New, pink or pearly-colored tissue that migrates across the wound bed from the edges as the wound closes", "Yellow, stringy, non-viable tissue requiring removal", "A collection of fluid within the wound"], "a": [1], "e": ["This describes eschar, not epithelial tissue.", "", "This describes slough, not epithelial tissue.", "This describes wound exudate/fluid collection, not epithelial tissue specifically."], "r": "Epithelial tissue is new, pink or pearly-colored tissue that migrates across the wound bed from the wound edges (or from residual epithelial structures in a partial-thickness wound) as the wound progresses toward closure.", "tip": "NCLEX Tip: The presence of epithelial tissue at the wound edges is a positive prognostic sign, indicating the wound is progressing toward closure."}, {"t": "sata", "q": "A nurse is describing different wound bed tissue types to a nursing student. Which of the following pairings are accurately matched? Select all that apply.", "o": ["Granulation tissue: beefy red, moist, and a positive sign of healing", "Slough: yellow/tan, stringy, generally needs debridement", "Eschar: hard, black/brown/tan, leathery necrotic tissue", "Epithelial tissue: black, hard necrotic tissue at the wound base", "Granulation tissue: dry, black, and leathery in appearance"], "a": [0, 1, 2], "e": ["", "", "", "This description is actually eschar, not epithelial tissue, which is pink/pearly new tissue.", "This description is actually eschar, not granulation tissue, which is beefy red and moist."], "r": "Correct pairings are granulation tissue (beefy red, moist, positive healing sign), slough (yellow/tan, stringy, needs debridement), and eschar (hard, black/brown/tan, leathery); epithelial tissue is pink/pearly new tissue, not black/hard, and granulation tissue is not dry/black/leathery.", "tip": "NCLEX Tip: Wound bed tissue type terminology (granulation, slough, eschar, epithelial) is a high-yield vocabulary set for both wound care and general medical-surgical nursing exams."}, {"t": "mc", "q": "A client asks why the nurse keeps changing the position of a heel that has a Stage 1 pressure injury, rather than simply applying a dressing and leaving it. The nurse's best explanation is:", "o": ["Repositioning has no real effect once a Stage 1 injury has developed", "Relieving ongoing pressure on the area through repositioning and offloading devices is essential to prevent progression to a deeper-stage injury", "Dressings alone are sufficient and repositioning is unnecessary", "Repositioning is only necessary for injuries at Stage 3 or higher"], "a": [1], "e": ["Repositioning remains highly relevant even at Stage 1, since continued pressure can cause rapid progression to a more severe injury.", "", "A dressing alone does not relieve the underlying pressure causing the injury; offloading/repositioning is essential in addition to any dressing used.", "Repositioning and pressure relief are important at every stage, including Stage 1, to prevent progression."], "r": "Continued, unrelieved pressure on an area with even a Stage 1 pressure injury can quickly progress to a deeper, more severe injury; repositioning and offloading devices (such as heel protectors) are essential preventive measures at every stage, not just more advanced ones.", "tip": "NCLEX Tip: The earlier pressure is relieved in the course of skin breakdown, the better the chance of preventing progression to a more severe pressure injury."}, {"t": "mc", "q": "Which factor related to nutrition most directly supports collagen synthesis during wound healing?", "o": ["Excessive fat intake", "Adequate protein and vitamin C intake", "Complete avoidance of all carbohydrates", "Restricting fluid intake"], "a": [1], "e": ["Excessive fat intake is not specifically linked to supporting collagen synthesis in the way protein and vitamin C are.", "", "Carbohydrates provide necessary energy for overall metabolic processes involved in healing and should not be completely avoided.", "Adequate, not restricted, fluid intake supports optimal tissue perfusion and overall wound healing."], "r": "Adequate protein intake provides the building blocks (amino acids) for collagen synthesis, while vitamin C is a necessary cofactor in this process, making both nutrients essential for effective wound healing.", "tip": "NCLEX Tip: Malnourished or protein-deficient clients are at significantly higher risk for delayed wound healing and increased infection risk."}, {"t": "mc", "q": "Which of the following client populations would the nurse prioritize for closer skin assessment and pressure injury prevention measures during hospitalization?", "o": ["A fully mobile, independently ambulating young adult with no comorbidities", "A critically ill, sedated client on mechanical ventilation with limited spontaneous movement", "A client who repositions themselves frequently without assistance", "A well-nourished client with no sensory deficits and full mobility"], "a": [1], "e": ["This client has minimal risk factors present.", "", "Frequent independent repositioning is protective and lowers risk.", "Good nutrition, intact sensation, and full mobility are all protective factors, lowering risk."], "r": "A critically ill, sedated, mechanically ventilated client with limited spontaneous movement has significant risk factors (immobility, altered sensory perception, potential nutritional compromise) for pressure injury development and requires prioritized, frequent skin assessment and preventive interventions.", "tip": "NCLEX Tip: ICU/critically ill, sedated clients are among the highest-risk populations for pressure injury development due to compounded immobility and altered perfusion/sensation."}, {"t": "mc", "q": "Which of the following is the correct sequence for a routine, non-emergent postoperative dressing change?", "o": ["Apply new dressing, then remove old dressing, then assess the wound", "Perform hand hygiene, remove old dressing, assess the wound, cleanse as ordered, apply new dressing, perform hand hygiene again", "Cleanse the wound before removing the old dressing", "Skip hand hygiene at the end since gloves were removed"], "a": [1], "e": ["A new dressing cannot appropriately be applied before removing the old one and assessing the wound.", "", "The old dressing should generally be removed before cleansing, so the wound bed can be properly assessed and cleansed.", "Hand hygiene should be performed both before AND after the procedure, regardless of glove use."], "r": "The standard sequence for a routine dressing change is: hand hygiene, remove the old dressing, assess the wound, cleanse as ordered, apply the new dressing, and perform hand hygiene again at the end.", "tip": "NCLEX Tip: Hand hygiene bookends every dressing change procedure — both before starting and after completing the task, regardless of glove use during the procedure itself."}, {"t": "mc", "q": "A client's Jackson-Pratt drain output has significantly decreased and the fluid is now serous (clear, light yellow) in color, several days after surgery. The nurse should interpret this as:", "o": ["A concerning sign requiring immediate surgeon notification", "An expected, reassuring trend as the wound heals and inflammation resolves, often prompting consideration for drain removal per provider order", "A sign of new infection requiring antibiotics", "Evidence the drain has become completely occluded"], "a": [1], "e": ["This trend is generally expected and reassuring, not concerning, in the healing process.", "", "A decreasing, clearing drainage pattern is not itself evidence of infection; if anything, it suggests resolution of the acute inflammatory response.", "A decreasing volume alone, especially if consistent with the expected healing trajectory, does not necessarily indicate occlusion; the nurse should still assess overall drain function."], "r": "A gradual decrease in drainage volume with a color progression from sanguineous to serosanguineous to serous is an expected, reassuring pattern as a surgical wound heals, and the provider may then order removal of the drain.", "tip": "NCLEX Tip: Learn the expected progression of surgical drainage character over time: bloody (sanguineous) → pink-tinged (serosanguineous) → clear/light yellow (serous) — a reversal of this pattern (getting bloodier) is concerning."}]}

<script>
(function(){
"use strict";

const RAW = JSON.parse(document.getElementById('quiz-data').textContent);
const MODULE_META = {
  m4: {tab:'mod1', name:"Module 4", full:"Central Venous Access, Airway &amp; Respiratory Assessment", short:"CVAD &amp; Airway", eyebrow:"MODULE 4"},
  m5: {tab:'mod2', name:"Module 5", full:"Chest Tubes, Respiratory Drainage &amp; Renal Concepts", short:"Chest Tubes &amp; Resp", eyebrow:"MODULE 5"},
  m6: {tab:'mod3', name:"Module 6", full:"Wound Healing, Surgical Drains &amp; Pressure Injury Care", short:"Wounds &amp; Drains", eyebrow:"MODULE 6"}
};
const TYPE_META = {
  mc:{label:"Multiple Choice"}, sata:{label:"Select All That Apply"},
  bowtie:{label:"Bowtie"}, fib:{label:"Fill in the Blank"}
};
const BANK = {};
Object.keys(RAW).forEach(mod=>{
  BANK[mod] = RAW[mod].map((q,i)=>Object.assign({}, q, {id: mod+'_'+i, module: mod}));
});

const state = {
  selectedModules: new Set(['m4','m5','m6']),
  counts: {m4:10, m5:10, m6:10},
  selectedTypes: new Set(['mc','sata','bowtie','fib']),
  queue: [],
  usedIds: new Set(),
  current: 0,
  answers: {},
  isRemediation: false
};
const wrongBankIds = new Set();

const panel = document.getElementById('app-panel');
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function letterFor(i){ return String.fromCharCode(65+i); }
function esc(s){ return (s||'').replace(/&/g,'&amp;'); }

// ---------- Header / Sidebar helpers ----------
function setHeader(eyebrow, title, subtitle, sideHtml){
  document.getElementById('headerEyebrow').innerHTML = eyebrow;
  document.getElementById('headerTitle').innerHTML = title;
  document.getElementById('headerSubtitle').innerHTML = subtitle;
  document.getElementById('headerSide').innerHTML = sideHtml || '';
}
function updateSidebarRemCount(){
  // no-op: sidebar remediation badge removed; remediation count is shown inline on the home screen
}

document.getElementById('btnHome').addEventListener('click', ()=> renderHome());

// ============================================================
// HOME
// ============================================================
function renderHome(remWarn){
  updateSidebarRemCount();
  setHeader(
    "NRSG 3333 &middot; Comprehensive Assessment &amp; Advanced Nursing Skills",
    "Exam 2 Practice Quiz",
    "Build a custom practice quiz from Modules 4&ndash;6. Choose your modules, question count, and NCLEX question styles, then start.",
    ""
  );

  const totalAvailable = {}; Object.keys(MODULE_META).forEach(m=>totalAvailable[m]=BANK[m].length);
  const grandTotal = Object.values(totalAvailable).reduce((a,b)=>a+b,0);

  panel.innerHTML = `
    <div class="scope-home">
      <div class="mod-hero">
        <div class="eyebrow">Getting Started</div>
        <h2>Build Your Practice Quiz</h2>
        <p>Select one or more modules below, set how many questions to pull from each, and choose which NCLEX question styles to include (multiple choice, SATA, bowtie, fill-in-the-blank).</p>
      </div>

      <section class="block">
        <h3>Select Module(s) <span class="tag">${grandTotal} questions in the bank</span></h3>
        <div id="module-cards" class="module-cards-grid"></div>
      </section>

      <section class="block">
        <h3>Question Types</h3>
        <div class="fc-controls" id="type-controls"></div>
      </section>

      <div class="callout info" id="hint-callout"></div>
      ${remWarn ? '<div class="callout caution"><span class="label">Nothing to review yet</span>You have not missed any questions this session. Take a quiz first, and any incorrect answers will show up here.</div>' : ''}
      <div class="callout high hidden" id="warn-callout" style="display:none;"></div>

      <div class="modal-nav" style="border-top:none;padding-top:4px;">
        <div class="side">
          <button class="nav-btn" id="btn-remediation-home">Remediation Queue (0)</button>
        </div>
        <button class="nav-btn primary" id="btn-start">Start Quiz &rarr;</button>
      </div>
    </div>
  `;

  const moduleCardsWrap = document.getElementById('module-cards');
  Object.keys(MODULE_META).forEach(m=>{
    const meta = MODULE_META[m];
    const selected = state.selectedModules.has(m);
    const card = document.createElement('div');
    card.className = 'card scope-'+meta.tab;
    card.style.cursor = 'pointer';
    card.style.borderLeftWidth = selected ? '4px' : '4px';
    card.style.outline = selected ? '2px solid var(--accent)' : 'none';
    card.style.outlineOffset = '0px';
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;">
        <div>
          <div class="mono" style="font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:4px;">${meta.eyebrow}</div>
          <h4 style="margin:0 0 4px;font-size:16px;">${meta.full}</h4>
          <div style="font-size:13px;color:var(--ink-faint);">${totalAvailable[m]} questions available in the bank</div>
        </div>
        <span class="fc-filter ${selected?'active':''}" style="flex-shrink:0;pointer-events:none;"><span class="dot"></span>${selected?'Included':'Add module'}</span>
      </div>
      <div class="count-row" id="count-row-${m}" style="${selected?'':'opacity:.4;pointer-events:none;'}">
        <label>Questions</label>
        <div class="stepper">
          <button type="button" data-step="-1" data-mod="${m}">&minus;</button>
          <input type="number" min="1" max="${totalAvailable[m]}" value="${Math.min(state.counts[m], totalAvailable[m])}" data-count="${m}">
          <button type="button" data-step="1" data-mod="${m}">+</button>
        </div>
        <span style="font-size:12.5px;color:var(--ink-faint);">of ${totalAvailable[m]} max</span>
      </div>
    `;
    moduleCardsWrap.appendChild(card);

    card.addEventListener('click', ()=>{
      if(state.selectedModules.has(m)) state.selectedModules.delete(m); else state.selectedModules.add(m);
      renderHome();
    });
    const numInput = card.querySelector('input[type=number]');
    numInput.addEventListener('click', e=>e.stopPropagation());
    numInput.addEventListener('input', (e)=>{
      let v = parseInt(e.target.value)||1;
      v = Math.max(1, Math.min(v, totalAvailable[m]));
      state.counts[m] = v;
      updateHint();
    });
    card.querySelectorAll('[data-step]').forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        const delta = parseInt(btn.dataset.step);
        let v = (state.counts[m]||1) + delta;
        v = Math.max(1, Math.min(v, totalAvailable[m]));
        state.counts[m] = v;
        numInput.value = v;
        updateHint();
      });
    });
  });

  const typeControls = document.getElementById('type-controls');
  Object.keys(TYPE_META).forEach(t=>{
    const selected = state.selectedTypes.has(t);
    const chip = document.createElement('button');
    chip.type='button';
    chip.className = 'fc-filter' + (selected?' active':'');
    chip.innerHTML = `<span class="dot"></span>${TYPE_META[t].label}`;
    chip.addEventListener('click', ()=>{
      if(state.selectedTypes.has(t)) state.selectedTypes.delete(t); else state.selectedTypes.add(t);
      renderHome();
    });
    typeControls.appendChild(chip);
  });

  function updateHint(){
    let total = 0;
    state.selectedModules.forEach(m=>{ total += Math.min(state.counts[m], totalAvailable[m]); });
    const hint = document.getElementById('hint-callout');
    if(state.selectedModules.size===0){
      hint.className = 'callout caution';
      hint.innerHTML = '<span class="label">Select a module</span>Choose at least one module to build your quiz.';
    } else {
      hint.className = 'callout info';
      hint.innerHTML = `<span class="label">Ready when you are</span>Your quiz will include up to <b>${total}</b> question(s) across <b>${state.selectedModules.size}</b> module(s).`;
    }
  }
  updateHint();

  const wrongCount = getWrongBank().length;
  const remBtn = document.getElementById('btn-remediation-home');
  remBtn.textContent = `Remediation Queue (${wrongCount})`;
  if(wrongCount===0){ remBtn.disabled = true; remBtn.style.opacity='.5'; }
  remBtn.addEventListener('click', ()=>{
    if(getWrongBank().length>0) startRemediation(); else renderHome(true);
  });

  document.getElementById('btn-start').addEventListener('click', ()=>{
    const warnEl = document.getElementById('warn-callout');
    if(state.selectedModules.size===0){
      warnEl.style.display='block'; warnEl.innerHTML = '<span class="label">Missing selection</span>Please select at least one module.';
      return;
    }
    if(state.selectedTypes.size===0){
      warnEl.style.display='block'; warnEl.innerHTML = '<span class="label">Missing selection</span>Please select at least one question type.';
      return;
    }
    buildQueue();
    if(state.queue.length===0){
      warnEl.style.display='block'; warnEl.innerHTML = '<span class="label">No matches</span>No questions match your selected modules and types. Try adding more question types.';
      return;
    }
    warnEl.style.display='none';
    state.isRemediation = false;
    state.current = 0;
    state.answers = {};
    renderQuiz();
  });
}

function buildQueue(){
  let pool = [];
  state.selectedModules.forEach(m=>{
    const avail = shuffle(BANK[m].filter(q=>state.selectedTypes.has(q.t)));
    const n = Math.min(state.counts[m], avail.length);
    pool = pool.concat(avail.slice(0,n));
  });
  state.queue = shuffle(pool);
  state.usedIds = new Set(state.queue.map(q=>q.id));
}

function getWrongBank(){
  return Array.from(wrongBankIds).map(id=>{
    const mod = id.split('_')[0];
    return BANK[mod].find(q=>q.id===id);
  }).filter(Boolean);
}
function startRemediation(){
  const qs = getWrongBank();
  if(qs.length===0) return;
  state.queue = shuffle(qs);
  state.isRemediation = true;
  state.current = 0;
  state.answers = {};
  renderQuiz();
}

// ============================================================
// QUIZ
// ============================================================
function renderQuiz(){
  const q = state.queue[state.current];
  const total = state.queue.length;
  const meta = MODULE_META[q.module];
  const pct = Math.round(((state.current+1)/total)*100);

  const sideHtml = `
    <div class="header-progress">
      <div class="ptrack"><div class="pfill" style="width:${pct}%"></div></div>
      <div class="plabel">Question ${state.current+1} of ${total}${state.isRemediation?' &middot; Remediation':''}</div>
    </div>
  `;
  setHeader(
    `${meta.eyebrow} &middot; ${TYPE_META[q.t].label}`,
    state.isRemediation ? 'Remediation Round' : meta.full,
    'Select your answer, then confirm to see the rationale and NCLEX tips.',
    sideHtml
  );

  panel.innerHTML = `
    <div class="scope-${meta.tab}">
      <section class="block">
        <h3>${meta.name} <span class="tag">${TYPE_META[q.t].label}</span></h3>
        <div class="card">
          <div class="q-count">Question ${state.current+1} of ${total}</div>
          <div class="q-text">${q.q}</div>
          <div id="answer-area"></div>
          <div id="validation-area"></div>
          <div id="feedback-area"></div>
          <div class="modal-nav">
            <div class="side">
              <button class="nav-btn" id="btn-prev">&larr; Previous</button>
              <button class="nav-btn" id="btn-next">Next &rarr;</button>
              <button class="nav-btn" id="btn-shuffle">&#8635; Shuffle Question</button>
            </div>
            <div class="side">
              <button class="nav-btn primary" id="btn-confirm">Confirm Answer</button>
              <button class="nav-btn exit" id="btn-finish">Finish &amp; See Results</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  `;

  renderAnswerArea(q);

  document.getElementById('btn-finish').addEventListener('click', renderResults);
  document.getElementById('btn-prev').addEventListener('click', ()=>{ state.current = (state.current - 1 + total) % total; renderQuiz(); });
  document.getElementById('btn-next').addEventListener('click', ()=>{ state.current = (state.current + 1) % total; renderQuiz(); });
  document.getElementById('btn-shuffle').addEventListener('click', ()=>doShuffleQuestion(q));
  document.getElementById('btn-confirm').addEventListener('click', ()=>confirmAnswer(q));

  const existing = state.answers[q.id];
  if(existing && existing.confirmed){
    lockAnswerUI(q, existing);
    showFeedback(q, existing);
    const cbtn = document.getElementById('btn-confirm');
    cbtn.disabled = true; cbtn.style.opacity='0.5';
  }
}

function doShuffleQuestion(currentQ){
  const mod = currentQ.module;
  const candidates = BANK[mod].filter(q=>state.selectedTypes.has(q.t) && !state.usedIds.has(q.id) && q.id!==currentQ.id);
  if(candidates.length===0){
    showValidationMessage('No more unused questions available in this module/type combination to shuffle in.');
    return;
  }
  const pick = candidates[Math.floor(Math.random()*candidates.length)];
  state.usedIds.delete(currentQ.id);
  state.usedIds.add(pick.id);
  delete state.answers[currentQ.id];
  state.queue[state.current] = pick;
  renderQuiz();
}

// ---------- Answer rendering ----------
function renderAnswerArea(q){
  const area = document.getElementById('answer-area');
  if(q.t==='mc'){
    area.innerHTML = `<div id="opts"></div>`;
    const opts = document.getElementById('opts');
    q.o.forEach((optText,i)=>{
      const div = document.createElement('button');
      div.type='button';
      div.className='modal-opt';
      div.dataset.idx = i;
      div.innerHTML = `<span class="opt-letter">${letterFor(i)}</span><span>${optText}</span><span class="opt-tooltip"></span>`;
      div.addEventListener('click', ()=>{
        if(div.classList.contains('locked')) return;
        [...opts.children].forEach(c=>c.classList.remove('picked'));
        div.classList.add('picked');
        state.answers[q.id] = state.answers[q.id]||{};
        state.answers[q.id].picked = [i];
      });
      opts.appendChild(div);
    });
  } else if(q.t==='sata'){
    area.innerHTML = `<div id="opts"></div><div style="font-size:13px;color:var(--ink-faint);margin:2px 0 12px;">Select all answers that apply.</div>`;
    const opts = document.getElementById('opts');
    q.o.forEach((optText,i)=>{
      const div = document.createElement('button');
      div.type='button';
      div.className='modal-opt sata';
      div.dataset.idx = i;
      div.innerHTML = `<span class="opt-letter">${letterFor(i)}</span><span>${optText}</span><span class="opt-tooltip"></span>`;
      div.addEventListener('click', ()=>{
        if(div.classList.contains('locked')) return;
        div.classList.toggle('picked');
        state.answers[q.id] = state.answers[q.id]||{picked:[]};
        const picked = new Set(state.answers[q.id].picked||[]);
        if(picked.has(i)) picked.delete(i); else picked.add(i);
        state.answers[q.id].picked = Array.from(picked);
      });
      opts.appendChild(div);
    });
  } else if(q.t==='fib'){
    area.innerHTML = `<div class="fib-input-wrap"><input type="text" id="fib-input" placeholder="Type your answer here" autocomplete="off"></div>`;
    document.getElementById('fib-input').addEventListener('input', (e)=>{
      state.answers[q.id] = state.answers[q.id]||{};
      state.answers[q.id].picked = e.target.value;
    });
  } else if(q.t==='bowtie'){
    renderBowtie(q, area);
  }
}

function renderBowtie(q, area){
  const actionsCount = q.actionsCount||2, monitorCount = q.monitorCount||2;
  area.innerHTML = `
    <div class="bowtie-cond-wrap">
      <h4 style="text-align:center;">Most Likely Condition (choose 1)</h4>
      <div id="bowtie-cond"></div>
    </div>
    <div class="bowtie-grid">
      <div class="bowtie-col" id="bowtie-actions"><h4>Actions to Take (choose ${actionsCount})</h4></div>
      <div class="bowtie-center"><svg viewBox="0 0 60 100"><path d="M5,5 L55,50 L5,95 Z M55,5 L5,50 L55,95 Z" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.55"/></svg></div>
      <div class="bowtie-col" id="bowtie-monitor"><h4>Parameters to Monitor (choose ${monitorCount})</h4></div>
    </div>
  `;
  state.answers[q.id] = state.answers[q.id] || {condition:null, actions:[], monitor:[]};

  const condWrap = document.getElementById('bowtie-cond');
  q.conditionOptions.forEach((text,i)=>{
    const div = document.createElement('button');
    div.type='button'; div.className='modal-opt';
    div.dataset.section='condition'; div.dataset.idx=i;
    div.innerHTML = `<span class="opt-letter">${letterFor(i)}</span><span>${text}</span><span class="opt-tooltip"></span>`;
    div.addEventListener('click',()=>{
      if(div.classList.contains('locked')) return;
      [...condWrap.children].forEach(c=>c.classList.remove('picked'));
      div.classList.add('picked');
      state.answers[q.id].condition = i;
    });
    condWrap.appendChild(div);
  });

  const actWrap = document.getElementById('bowtie-actions');
  q.actions.forEach((text,i)=>{
    const div = document.createElement('button');
    div.type='button'; div.className='modal-opt sata';
    div.dataset.section='actions'; div.dataset.idx=i;
    div.innerHTML = `<span class="opt-letter">${letterFor(i)}</span><span style="font-size:14px;">${text}</span><span class="opt-tooltip"></span>`;
    div.addEventListener('click',()=>{
      if(div.classList.contains('locked')) return;
      div.classList.toggle('picked');
      const set = new Set(state.answers[q.id].actions);
      if(set.has(i)) set.delete(i); else set.add(i);
      state.answers[q.id].actions = Array.from(set);
    });
    actWrap.appendChild(div);
  });

  const monWrap = document.getElementById('bowtie-monitor');
  q.monitor.forEach((text,i)=>{
    const div = document.createElement('button');
    div.type='button'; div.className='modal-opt sata';
    div.dataset.section='monitor'; div.dataset.idx=i;
    div.innerHTML = `<span class="opt-letter">${letterFor(i)}</span><span style="font-size:14px;">${text}</span><span class="opt-tooltip"></span>`;
    div.addEventListener('click',()=>{
      if(div.classList.contains('locked')) return;
      div.classList.toggle('picked');
      const set = new Set(state.answers[q.id].monitor);
      if(set.has(i)) set.delete(i); else set.add(i);
      state.answers[q.id].monitor = Array.from(set);
    });
    monWrap.appendChild(div);
  });
}

// ---------- Confirm & grade ----------
function showValidationMessage(msg){
  const v = document.getElementById('validation-area');
  if(!v) return;
  if(!msg){ v.innerHTML=''; return; }
  v.innerHTML = `<div class="callout caution"><span class="label">Almost there</span>${msg}</div>`;
}

function confirmAnswer(q){
  const ans = state.answers[q.id];
  let correct = false;
  showValidationMessage('');
  if(!ans){ showValidationMessage('Please select an answer before confirming.'); return; }
  if(q.t==='mc'){
    if(!ans.picked || ans.picked.length===0){ showValidationMessage('Please select an answer.'); return; }
    correct = ans.picked[0] === q.a[0];
  } else if(q.t==='sata'){
    if(!ans.picked || ans.picked.length===0){ showValidationMessage('Please select at least one answer.'); return; }
    const a = new Set(q.a), p = new Set(ans.picked);
    correct = a.size===p.size && [...a].every(x=>p.has(x));
  } else if(q.t==='fib'){
    if(!ans.picked || !ans.picked.trim()){ showValidationMessage('Please type an answer.'); return; }
    const normalize = s=>s.trim().toLowerCase().replace(/[^a-z0-9. ]/g,'');
    correct = q.blanks[0].some(accepted=> normalize(accepted)===normalize(ans.picked));
  } else if(q.t==='bowtie'){
    const actionsCount = q.actionsCount||2, monitorCount = q.monitorCount||2;
    const condMissing = ans.condition===null || ans.condition===undefined;
    const actionsWrong = (ans.actions||[]).length!==actionsCount;
    const monitorWrong = (ans.monitor||[]).length!==monitorCount;
    if(condMissing || actionsWrong || monitorWrong){
      const parts = [];
      if(condMissing) parts.push('select 1 most likely condition');
      if(actionsWrong) parts.push(`select exactly ${actionsCount} action(s) (currently ${((ans.actions)||[]).length} selected)`);
      if(monitorWrong) parts.push(`select exactly ${monitorCount} monitoring parameter(s) (currently ${((ans.monitor)||[]).length} selected)`);
      showValidationMessage('Please ' + parts.join(', and ') + ' before confirming.');
      return;
    }
    const condOK = ans.condition === q.correctCondition;
    const aSet = new Set(q.correctActions), aPick = new Set(ans.actions);
    const actOK = aSet.size===aPick.size && [...aSet].every(x=>aPick.has(x));
    const mSet = new Set(q.correctMonitor), mPick = new Set(ans.monitor);
    const monOK = mSet.size===mPick.size && [...mSet].every(x=>mPick.has(x));
    correct = condOK && actOK && monOK;
  }
  ans.confirmed = true;
  ans.correct = correct;
  if(!correct) wrongBankIds.add(q.id); else wrongBankIds.delete(q.id);
  updateSidebarRemCount();

  lockAnswerUI(q, ans);
  showFeedback(q, ans);
  const btn = document.getElementById('btn-confirm');
  btn.disabled = true; btn.style.opacity='0.5';
}

function lockAnswerUI(q, ans){
  if(q.t==='mc' || q.t==='sata'){
    const opts = document.querySelectorAll('#opts .modal-opt');
    opts.forEach((div,i)=>{
      div.classList.add('locked');
      const isCorrect = q.a.includes(i);
      const wasPicked = (ans.picked||[]).includes(i);
      if(isCorrect) div.classList.add('correct');
      else if(wasPicked) div.classList.add('incorrect');
      if(!isCorrect){
        div.classList.add('revealable');
        div.querySelector('.opt-tooltip').textContent = q.e[i] || "This option does not best fit the scenario.";
      }
    });
  } else if(q.t==='fib'){
    const input = document.getElementById('fib-input');
    input.disabled = true;
    input.classList.add(ans.correct ? 'correct':'incorrect');
    if(!ans.correct){
      const div = document.createElement('div');
      div.className='fib-reveal';
      div.textContent = 'Accepted answer(s): ' + q.blanks[0].join(', ');
      input.parentElement.appendChild(div);
    }
  } else if(q.t==='bowtie'){
    lockBowtieSection('condition', [q.correctCondition], ans.condition===null?[]:[ans.condition], q.conditionExplain);
    lockBowtieSection('actions', q.correctActions, ans.actions, q.actionsExplain);
    lockBowtieSection('monitor', q.correctMonitor, ans.monitor, q.monitorExplain);
  }
}
function lockBowtieSection(section, correctArr, pickedArr, explainArr){
  document.querySelectorAll(`.modal-opt[data-section="${section}"]`).forEach((div)=>{
    const i = parseInt(div.dataset.idx);
    div.classList.add('locked');
    const isCorrect = correctArr.includes(i);
    const wasPicked = pickedArr.includes(i);
    if(isCorrect) div.classList.add('correct');
    else if(wasPicked) div.classList.add('incorrect');
    if(!isCorrect){
      div.classList.add('revealable');
      div.querySelector('.opt-tooltip').textContent = (explainArr && explainArr[i]) || "This option is not part of the correct answer.";
    }
  });
}

function showFeedback(q, ans){
  const fb = document.getElementById('feedback-area');
  fb.innerHTML = `
    <div class="callout ${ans.correct?'tip':'high'}">
      <span class="label">${ans.correct? 'Correct' : 'Not quite'}</span>
      ${q.r}
    </div>
    <div class="callout info">
      <span class="label">NCLEX Tip</span>
      ${q.tip.replace(/^NCLEX Tip:\s*/,'')}
    </div>
  `;
}

// ============================================================
// RESULTS
// ============================================================
function renderResults(){
  const total = state.queue.length;
  let correctCount = 0;
  const wrongList = [];
  state.queue.forEach(q=>{
    const a = state.answers[q.id];
    if(a && a.confirmed && a.correct) correctCount++;
    else wrongList.push(q);
  });
  const pct = total>0 ? Math.round((correctCount/total)*100) : 0;

  let encourage = "";
  if(pct>=90) encourage = "Outstanding work! Your clinical judgment is sharp &mdash; you're ready to bring this energy to the real exam.";
  else if(pct>=75) encourage = "Great job! You've got a solid grasp of this material. Review the missed items below and you'll be unstoppable.";
  else if(pct>=60) encourage = "Good effort! You're building real knowledge here. A little more review of the missed concepts will make a big difference.";
  else encourage = "Every attempt makes you sharper. Use the remediation queue below to turn these misses into strengths &mdash; you've got this.";

  setHeader("Results", "Quiz Complete" + (state.isRemediation?' &middot; Remediation Round':''), "Here's how you did &mdash; review your missed questions below, or start a new quiz.", "");

  panel.innerHTML = `
    <div class="scope-home">
      <section class="block">
        <div class="card" style="text-align:center;padding:32px 20px;">
          <div class="score-circle" style="--pct:${pct};">
            <div class="inner">
              <div class="pctnum">${pct}%</div>
              <div class="pctlabel">${correctCount}/${total} correct</div>
            </div>
          </div>
          <p style="max-width:480px;margin:0 auto 18px;color:var(--ink-soft);">${encourage}</p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <button class="nav-btn primary" id="btn-again">Take Another Quiz</button>
            ${wrongList.length>0 ? `<button class="nav-btn" id="btn-remediate">Review ${wrongList.length} Missed Question(s)</button>` : ''}
          </div>
        </div>
      </section>
      ${wrongList.length>0 ? `
      <section class="block">
        <h3>Missed Questions <span class="tag">${wrongList.length}</span></h3>
        ${wrongList.map(q=>`<div class="card scope-${MODULE_META[q.module].tab}"><div class="mono" style="font-size:11px;color:var(--accent);font-weight:700;margin-bottom:6px;">${MODULE_META[q.module].eyebrow} &middot; ${TYPE_META[q.t].label}</div>${q.q}</div>`).join('')}
      </section>` : `
      <section class="block">
        <div class="callout tip"><span class="label">Perfect run</span>No missed questions this time!</div>
      </section>`}
    </div>
  `;
  document.getElementById('btn-again').addEventListener('click', ()=>renderHome());
  const remBtn = document.getElementById('btn-remediate');
  if(remBtn) remBtn.addEventListener('click', ()=>{
    wrongList.forEach(q=>wrongBankIds.add(q.id));
    startRemediation();
  });

  if(pct>=90 && total>0) launchConfetti();
}

// ---------- Confetti ----------
function launchConfetti(){
  const canvas = document.getElementById('confetti');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  const colors = ['#7C58D1','#2C74B3','#9B4FBD','#2E8F5C','#B9821A','#C2402F'];
  let particles = [];
  for(let i=0;i<160;i++){
    particles.push({
      x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height*0.5,
      r: 4+Math.random()*6, c: colors[Math.floor(Math.random()*colors.length)],
      vy: 2+Math.random()*3, vx: -2+Math.random()*4, rot: Math.random()*360, vr: -6+Math.random()*12
    });
  }
  let frame = 0; const maxFrames = 260;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);
      ctx.restore();
    });
    if(frame < maxFrames) requestAnimationFrame(tick);
    else { canvas.style.display='none'; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  tick();
}

renderHome();
})();
</script>
