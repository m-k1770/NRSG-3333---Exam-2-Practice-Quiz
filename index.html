<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NRSG 3333 - Exam 2 Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E6ED;
  --bg-alt:#D7DAE3;
  --card:#FFFFFF;
  --ink:#1C2333;
  --ink-soft:#525B6E;
  --ink-faint:#8991A3;
  --line:#E1E5EC;

  --primary:#25335C;      /* deep indigo navy - headers, brand */
  --primary-dark:#161E3B;
  --primary-pale:#E7EAF3;

  --gold:#7C58D1;         /* violet - checkpoint / interactive accent */
  --gold-dark:#5E3FAE;
  --gold-pale:#EFE9FB;

  --red:#C2402F;          /* critical */
  --red-pale:#FBE5E1;

  --amber:#B9821A;        /* caution */
  --amber-pale:#FAF0DB;

  --blue:#2C74B3;         /* info */
  --blue-pale:#E4EFF8;

  --green:#2E8F5C;        /* tip / reassurance */
  --green-pale:#E3F3EA;

  --teal:#1E8A99;         /* flash cards theme */
  --teal-pale:#DFF1F3;

  /* per-tab theme colors */
  --t-mod1:#7C58D1;
  --t-mod2:#2C74B3;
  --t-mod3:#9B4FBD;
  --t-drugs:#C23B6E;
  --t-priority:#C2402F;
  --t-flash:#1E8A99;

  --t-mod3-pale:#F2E7F7;
  --t-drugs-pale:#FBE6ED;

  --sidebar-w:246px;

  --radius:14px;
  --shadow: 0 2px 10px rgba(28,35,51,0.07), 0 1px 2px rgba(28,35,51,0.06);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Source Serif 4',serif;
  color:var(--primary-dark);
  margin:0 0 .4em 0;
  font-weight:600;
  letter-spacing:-0.01em;
}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:var(--primary);}
p{margin:0 0 .8em 0;}
ul,ol{margin:.3em 0 .9em 0; padding-left:1.3em;}
li{margin-bottom:.3em;}
button{font-family:'Inter',sans-serif;}

/* ---------- minimal top accent bar ---------- */
.top-accent-bar{
  width:100%;height:5px;
  background:linear-gradient(90deg,var(--primary) 0%,var(--primary) 55%,var(--gold) 100%);
}

/* ---------- Simple full-width layout ---------- */
.content-area{width:100%;}

.home-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);color:#fff;
  padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;
  font-family:'Inter',sans-serif;transition:background .15s;flex-shrink:0;
}
.home-btn:hover{background:rgba(255,255,255,.2);}
.home-btn svg{width:15px;height:15px;flex-shrink:0;}

/* ---------- Top banner (dark purple/blue) ---------- */
header.top{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  position:relative;overflow:hidden;
}
header.top::before{
  content:"";position:absolute;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle, rgba(124,88,209,0.35), transparent 70%);
  top:-160px;right:60px;pointer-events:none;
}
header.top::after{
  content:"";position:absolute;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle, rgba(30,138,153,0.28), transparent 70%);
  bottom:-130px;left:8%;pointer-events:none;
}
.header-inner{
  max-width:1180px;margin:0 auto;padding:30px 32px 34px 32px;position:relative;
  display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;
}
.brand-eyebrow{
  font-family:'IBM Plex Mono',monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:#B9A8EA;font-weight:600;margin-bottom:4px;
}
h1.title{font-size:28px;margin-bottom:2px;color:#fff;}
.subtitle{color:#C6CBE6;font-size:14.5px;max-width:660px;}
.header-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
.header-progress{min-width:220px;}
.header-progress .ptrack{height:7px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;}
.header-progress .pfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--teal));border-radius:99px;transition:width .25s;}
.header-progress .plabel{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#C6CBE6;margin-top:5px;text-align:right;text-transform:uppercase;letter-spacing:.06em;}

main{max-width:1180px;margin:0 auto;padding:30px 32px 80px 32px;}
.panel{animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* per-module accent scoping */
.scope-mod1{--accent:var(--t-mod1);--accent-pale:var(--gold-pale);}
.scope-mod2{--accent:var(--t-mod2);--accent-pale:var(--blue-pale);}
.scope-mod3{--accent:var(--t-mod3);--accent-pale:var(--t-mod3-pale);}
.scope-home{--accent:var(--gold);--accent-pale:var(--gold-pale);}
.scope-remediation{--accent:var(--red);--accent-pale:var(--red-pale);}

/* module intro hero */
.mod-hero{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  color:#E9ECF6;border-radius:var(--radius);padding:26px 28px;margin-bottom:26px;
  border-left:6px solid var(--accent, var(--gold));
}
.mod-hero .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent, #B9A8EA);font-weight:600;margin-bottom:6px;}
.mod-hero h2{color:#fff;font-size:26px;margin-bottom:8px;}
.mod-hero p{color:#D4D9EC;max-width:760px;margin-bottom:0;font-size:14.5px;}

/* section blocks */
section.block{margin-bottom:12px;}
.block h3{
  font-size:20px;border-bottom:2px solid var(--accent, var(--line));padding-bottom:8px;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.block h3 .tag{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;
  background:var(--accent-pale, var(--primary-pale));color:var(--primary-dark);padding:3px 8px;border-radius:20px;
  letter-spacing:.04em;
}
.block h4{font-size:16px;color:var(--ink);margin-top:18px;}

.card{
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent, var(--line));
  border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.module-cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch;}
.module-cards-grid .card{display:flex;flex-direction:column;height:100%;}
.module-cards-grid .count-row{margin-top:auto;padding-top:12px;}
@media (max-width:820px){.grid2,.grid3,.module-cards-grid{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px;}
th{
  text-align:left;background:var(--accent-pale, var(--primary-pale));color:var(--primary-dark);
  font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
  padding:9px 10px;border-bottom:2px solid var(--accent, #C7CEE5);
}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.data-table-wrap{overflow-x:auto;}

/* callouts */
.callout{border-radius:10px;padding:14px 16px;margin:14px 0;font-size:14.5px;border-left:5px solid;}
.callout.high{background:var(--red-pale);border-color:var(--red);}
.callout.caution{background:var(--amber-pale);border-color:var(--amber);}
.callout.info{background:var(--blue-pale);border-color:var(--blue);}
.callout.tip{background:var(--green-pale);border-color:var(--green);}
.callout .label{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;display:block;margin-bottom:5px;
}
.callout.high .label{color:var(--red);}
.callout.caution .label{color:var(--amber);}
.callout.info .label{color:var(--blue);}
.callout.tip .label{color:var(--green);}

/* pill list */
.pill-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.pill{background:var(--bg-alt);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px;font-family:'IBM Plex Mono',monospace;}

/* selectable filter chips (module / type toggles) */
.fc-filter{
  background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:8px 16px;
  font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-soft);font-family:'Inter',sans-serif;
  display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s,color .15s;
}
.fc-filter .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-faint);flex-shrink:0;}
.fc-filter.active{background:var(--accent, var(--primary));border-color:var(--accent, var(--primary));color:#fff;}
.fc-filter.active .dot{background:#fff;}
.fc-controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;}

/* checkpoint-style trigger button */
.cp-trigger{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--accent-pale, var(--gold-pale));color:var(--accent, var(--gold-dark));border:1.5px solid var(--accent, var(--gold));
  padding:9px 16px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;
  margin:4px 0 4px 0;font-family:'Inter',sans-serif;transition:background .15s,color .15s;
}
.cp-trigger:hover{background:var(--accent, var(--gold));color:#fff;}
.cp-trigger .badge{
  background:var(--accent, var(--gold));color:#fff;border-radius:50%;width:18px;height:18px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-family:'IBM Plex Mono',monospace;
}
.cp-trigger:hover .badge{background:#fff;color:var(--accent, var(--gold-dark));}
.cp-trigger:disabled{opacity:.45;cursor:default;}
.cp-trigger:disabled:hover{background:var(--accent-pale, var(--gold-pale));color:var(--accent, var(--gold-dark));}

/* count stepper */
.count-row{display:flex;align-items:center;gap:10px;margin-top:12px;}
.count-row label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;}
.stepper button{background:var(--bg-alt);border:none;width:30px;height:32px;font-size:16px;cursor:pointer;color:var(--primary-dark);font-weight:700;}
.stepper button:hover{background:var(--accent-pale, var(--primary-pale));}
.stepper input{width:52px;border:none;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px;height:32px;color:var(--ink);}
.stepper input:focus{outline:none;}

/* modal-opt style option buttons, used inline for quiz answers */
.modal-opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--bg);
  border:1.5px solid var(--line);color:var(--ink);border-radius:9px;
  padding:13px 15px;margin-bottom:9px;cursor:pointer;font-size:14.5px;font-family:'Inter',sans-serif;
  transition:border-color .15s,background .15s;position:relative;
}
.modal-opt:hover:not(:disabled){border-color:var(--accent, var(--primary));}
.modal-opt .opt-letter{
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;color:var(--ink-faint);
  border:1.5px solid var(--line);border-radius:50%;width:22px;height:22px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.modal-opt.sata .opt-letter{border-radius:6px;}
.modal-opt.picked{border-color:var(--accent, var(--primary));background:var(--accent-pale, var(--primary-pale));}
.modal-opt.picked .opt-letter{border-color:var(--accent, var(--primary));background:var(--accent, var(--primary));color:#fff;}
.modal-opt.correct{background:var(--green-pale);border-color:var(--green);color:var(--green);font-weight:600;}
.modal-opt.correct .opt-letter{background:var(--green);border-color:var(--green);color:#fff;}
.modal-opt.incorrect{background:var(--red-pale);border-color:var(--red);color:var(--red);font-weight:600;}
.modal-opt.incorrect .opt-letter{background:var(--red);border-color:var(--red);color:#fff;}
.modal-opt:disabled,.modal-opt.locked{cursor:default;}
.modal-opt .opt-tooltip{
  display:none;position:absolute;left:0;top:104%;z-index:5;background:var(--primary-dark);color:#fff;
  padding:10px 14px;border-radius:9px;font-size:13px;line-height:1.4;width:100%;font-weight:400;
  box-shadow:0 10px 24px rgba(0,0,0,.2);
}
.modal-opt.revealable:hover .opt-tooltip{display:block;}

.fib-input-wrap input[type=text]{
  padding:12px 15px;border:1.5px solid var(--line);border-radius:9px;font-size:14.5px;width:100%;max-width:380px;
  font-family:'Inter',sans-serif;color:var(--ink);
}
.fib-input-wrap input[type=text]:focus{outline:none;border-color:var(--accent, var(--primary));}
.fib-input-wrap input.correct{border-color:var(--green);background:var(--green-pale);}
.fib-input-wrap input.incorrect{border-color:var(--red);background:var(--red-pale);}
.fib-reveal{font-size:13.5px;color:var(--ink-soft);margin-top:8px;font-family:'IBM Plex Mono',monospace;}

.q-count{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;
}
.q-text{font-size:17px;font-weight:600;color:var(--ink);margin-bottom:16px;line-height:1.5;}

/* modal-style nav footer (reused inline, not an actual modal) */
.modal-nav{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:16px 0 0 0;margin-top:8px;border-top:1px solid var(--line);
}
.modal-nav .side{display:flex;gap:8px;flex-wrap:wrap;}
.nav-btn{
  background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);border-radius:8px;
  padding:9px 15px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;
}
.nav-btn:hover:not(:disabled){border-color:var(--accent, var(--primary));color:var(--primary-dark);}
.nav-btn:disabled{opacity:.4;cursor:default;}
.nav-btn.primary{background:var(--accent, var(--primary));border-color:var(--accent, var(--primary));color:#fff;}
.nav-btn.primary:hover{filter:brightness(0.92);}
.nav-btn.exit{background:var(--red-pale);border-color:var(--red);color:var(--red);}
.nav-btn.exit:hover{background:var(--red);color:#fff;}

/* bowtie */
.bowtie-cond-wrap{max-width:520px;margin:0 auto 18px;}
.bowtie-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:stretch;}
.bowtie-col h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);margin:0 0 10px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:600;}
.bowtie-center{display:flex;align-items:center;justify-content:center;padding:0 16px;}
.bowtie-center svg{width:54px;height:100px;}

/* score circle */
.score-circle{width:150px;height:150px;border-radius:50%;margin:10px auto 20px;display:flex;align-items:center;justify-content:center;flex-direction:column;background:conic-gradient(var(--accent, var(--gold)) calc(var(--pct)*1%), var(--bg-alt) 0);}
.score-circle .inner{width:118px;height:118px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.score-circle .pctnum{font-size:30px;font-weight:800;color:var(--primary-dark);font-family:'Source Serif 4',serif;}
.score-circle .pctlabel{font-size:11px;color:var(--ink-faint);text-transform:uppercase;font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;}

canvas#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999;}

footer{
  text-align:center;padding:30px 20px;color:var(--ink-faint);font-size:12.5px;
  border-top:1px solid var(--line);margin-top:20px;
}
</style>
</head>
<body>
<canvas id="confetti" class="hidden" style="display:none;"></canvas>

<div class="content-area">

<header class="top">
  <div class="top-accent-bar"></div>
  <div class="header-inner">
    <div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;">
      <button class="home-btn" id="btnHome"><svg viewBox="0 0 24 24"><path d="M3 11 L12 4 L21 11 V20 H15 V14 H9 V20 H3 Z" fill="#fff"/></svg>Home</button>
      <div>
        <div class="brand-eyebrow" id="headerEyebrow">NRSG 3333 &middot; Comprehensive Assessment &amp; Advanced Nursing Skills</div>
        <h1 class="title" id="headerTitle">Exam 2 Practice Quiz</h1>
        <div class="subtitle" id="headerSubtitle">Build a custom practice quiz from Modules 4&ndash;6, in NCLEX question styles.</div>
      </div>
    </div>
    <div class="header-side" id="headerSide"></div>
  </div>
</header>

<main>
<section class="panel" id="app-panel"></section>
</main>

</div>

hemotherapy must be given through a central line instead of a regular IV. The nurse's best explanation is that:", "o": ["Central lines are simply more convenient for the nursing staff", "Some chemotherapy agents are vesicants that can severely damage peripheral tissue if they leak, so central veins with higher blood flow reduce this risk", "Central lines never have any complications, unlike peripheral IVs", "It is hospital policy with no clinical reasoning behind it"], "a": [1], "e": ["This response focuses on staff convenience rather than the actual clinical rationale, which is not patient-centered.", "", "Central lines have their own complications (e.g., CLABSI, pneumothorax) and are not risk-free.", "This response inaccurately implies there is no clinical basis for the practice."], "r": "Vesicant medications require the higher blood flow of central veins to rapidly dilute the drug and minimize the risk of extravasation injury that could occur in a smaller peripheral vein.", "tip": "NCLEX Tip: Vesicants + high osmolarity solutions = central line indication; know the pathophysiologic 'why,' not just the rule."}, {"t": "mc", "q": "Which statement about non-tunneled central venous catheters is accurate?", "o": ["They are intended for long-term use lasting several months", "They are inserted through a subcutaneous tunnel before entering the vein", "They are inserted directly into a central vein and are typically used for short-term access of days to weeks", "They have a cuff that promotes tissue ingrowth to reduce infection risk"], "a": [2], "e": ["Non-tunneled catheters are for short-term use, not long-term.", "This describes a tunneled catheter, not a non-tunneled one.", "", "The cuff feature is characteristic of tunneled catheters, not non-tunneled ones."], "r": "Non-tunneled CVCs are inserted directly into a central vein (internal jugular, subclavian, or femoral) and are used for short-term access, typically days to weeks, most often in ICU or emergency settings.", "tip": "NCLEX Tip: Non-tunneled = fast to place, short-term, higher infection risk because the exit site is right at the vein entry."}, {"t": "mc", "q": "Which is a key advantage of a tunneled central venous catheter compared to a non-tunneled catheter?", "o": ["It can be placed at the bedside without any imaging", "It has a lower infection risk because bacteria must travel further through the subcutaneous tunnel to reach the bloodstream", "It does not require any radiologic confirmation prior to use", "It is designed only for emergency, single-use venous access"], "a": [1], "e": ["Tunneled catheters are placed in the OR or interventional radiology using fluoroscopy, not simply at the bedside without imaging.", "", "All CVADs require radiologic confirmation of placement before use.", "Tunneled catheters are for long-term, not single emergency, use."], "r": "A tunneled catheter's subcutaneous tunnel physically separates the skin exit site from the vein entry site, meaning bacteria must travel farther to reach the bloodstream, lowering infection risk compared with a non-tunneled catheter.", "tip": "NCLEX Tip: The Dacron cuff in a tunneled catheter also anchors the catheter and forms a barrier to migrating organisms."}, {"t": "mc", "q": "A PICC line is most appropriately described as which of the following?", "o": ["A catheter inserted into the subclavian vein and tunneled under the skin to the chest", "A catheter inserted via the basilic, cephalic, or brachial vein with the tip terminating in the superior vena cava", "A device fully implanted under the skin, accessed only with a special needle", "A catheter used only for a single IV push medication"], "a": [1], "e": ["This describes a tunneled catheter or implanted port scenario, not a PICC.", "", "This describes an implanted port, not a PICC.", "PICC lines are used for long-term, repeated therapy, not a single IV push."], "r": "A PICC (peripherally inserted central catheter) is inserted through the basilic, cephalic, or brachial vein and threaded so its tip rests in the superior vena cava, providing central access for long-term therapy.", "tip": "NCLEX Tip: PICC = peripheral insertion site, but CENTRAL tip location (SVC) — that combination is what makes it a true CVAD."}, {"t": "mc", "q": "Which of the following statements correctly differentiates a PICC line from a midline catheter?", "o": ["A midline catheter's tip terminates in the superior vena cava, just like a PICC", "A PICC tip terminates in the superior vena cava (central circulation), while a midline catheter tip terminates in the upper arm and does not enter central circulation", "A midline catheter is appropriate for infusing vesicant chemotherapy", "A PICC line does not require any radiologic confirmation before use"], "a": [1], "e": ["This is incorrect; a midline's tip stays in the upper arm and does not reach central circulation.", "", "Midline catheters are NOT appropriate for vesicants, TPN, or agents requiring central dilution.", "PICC lines, like all CVADs, require radiologic confirmation of tip placement before use."], "r": "The key distinction is tip location: a PICC's tip advances into the superior vena cava (true central access), while a midline catheter's tip remains in the upper arm, short of the axilla, and never enters central circulation.", "tip": "NCLEX Tip: Because a midline never reaches central circulation, it cannot be used for vesicants, TPN, or hyperosmolar solutions — only peripheral-appropriate fluids/antibiotics."}, {"t": "mc", "q": "A nurse notes that a midline catheter is ordered for a client who needs IV antibiotics for 10 days but has difficult peripheral access. The nurse understands that a midline catheter is appropriate here because:", "o": ["The client needs central venous pressure monitoring", "The therapy duration (intermediate, 1-4 weeks) and non-vesicant nature of antibiotics fit the appropriate use of a midline catheter", "The client needs to receive TPN through this device", "A midline requires daily radiologic tip verification"], "a": [1], "e": ["Midline catheters cannot be used for hemodynamic monitoring, which requires true central access.", "", "TPN requires central dilution and is not appropriate for a midline catheter.", "Midlines do not require ongoing radiologic tip verification, and in fact do not require an X-ray at all before use."], "r": "Midline catheters are appropriate for intermediate-duration (1-4 weeks) therapies such as IV antibiotics and fluids when peripheral access is difficult, but they cannot be used for vesicants, TPN, or central hemodynamic monitoring.", "tip": "NCLEX Tip: The course explicitly notes midline catheters will not be tested in depth, but you should still recognize their appropriate use versus a true CVAD."}, {"t": "mc", "q": "Which imaging method is used to verify placement DURING insertion of a tunneled central venous catheter?", "o": ["Post-procedure chest X-ray only", "Fluoroscopy", "Bedside ultrasound only, with no further imaging needed", "MRI"], "a": [1], "e": ["A chest X-ray is used for non-tunneled lines placed at the bedside, not as the primary intraoperative verification method for tunneled catheters.", "", "Ultrasound may assist with vein access, but real-time fluoroscopy is used to confirm tip placement during a tunneled line insertion.", "MRI is not used for real-time catheter placement verification."], "r": "Tunneled catheters are placed in the OR or interventional radiology using fluoroscopy, a real-time continuous X-ray imaging technique, to confirm correct tip placement during the procedure itself.", "tip": "NCLEX Tip: If real-time fluoroscopy already confirmed tip placement during insertion, a separate post-procedure chest X-ray is not required."}, {"t": "mc", "q": "A non-tunneled central line was just placed at the bedside using ultrasound guidance. Before the line can be used for infusion, the nurse should anticipate which order?", "o": ["An MRI of the chest", "A chest X-ray to confirm tip placement and rule out pneumothorax", "An echocardiogram", "No imaging is required since ultrasound was used during insertion"], "a": [1], "e": ["MRI is not the standard immediate post-insertion verification tool for a bedside CVAD.", "", "An echocardiogram is not the standard method to verify catheter tip placement.", "Ultrasound guidance during insertion does not replace the required post-procedure chest X-ray for non-tunneled lines."], "r": "A chest X-ray is required after bedside placement of a non-tunneled CVAD or PICC line to confirm correct catheter tip location and to rule out a pneumothorax before the device is used.", "tip": "NCLEX Tip: Non-tunneled/PICC at bedside = X-ray after; tunneled line in OR/IR with real-time fluoroscopy = no additional X-ray needed."}, {"t": "mc", "q": "Prior to insertion of any CVAD, the nurse's priority action is to ensure that:", "o": ["The client has eaten a full meal", "Informed consent has been obtained, since CVAD insertion is an invasive procedure", "The client is NPO for 24 hours", "The client has been given a sedative regardless of the type of line"], "a": [1], "e": ["Meal status is not the priority consideration for CVAD insertion consent.", "", "A prolonged NPO period is not a universal requirement for all CVAD insertions.", "Sedation needs vary based on the specific procedure and are not automatically required for every CVAD type."], "r": "Because CVAD insertion is an invasive medical procedure, informed consent must be obtained from the client (or their legal representative) before the procedure takes place.", "tip": "NCLEX Tip: Verifying informed consent is a foundational nursing responsibility before any invasive procedure, including CVAD placement."}, {"t": "mc", "q": "A triple-lumen central catheter has proximal, medial, and distal lumens. Which lumen is the LARGEST and is appropriately used for blood draws and CVP monitoring?", "o": ["Proximal lumen (18 gauge)", "Medial lumen (18 gauge)", "Distal lumen (16 gauge)", "All lumens are the same size"], "a": [2], "e": ["The proximal lumen is 18 gauge, smaller than the distal lumen, and is typically used for fluids/TPN/medications.", "The medial lumen is 18 gauge and is typically reserved for medications.", "", "Lumens differ in gauge size and designated use."], "r": "The distal lumen is the largest (16 gauge) and is used for blood draws, blood administration, and central venous pressure monitoring, while the smaller proximal and medial lumens (18 gauge) are used for fluids, TPN, and medications.", "tip": "NCLEX Tip: Remember 'distal = biggest lumen = blood draws/CVP,' since the largest bore reduces hemolysis risk during sampling."}, {"t": "mc", "q": "A nurse needs to draw blood from a triple-lumen central catheter that is also infusing TPN and a continuous medication through separate lumens. What is the priority action before drawing the sample?", "o": ["Draw the blood sample from any lumen without stopping other infusions", "Temporarily stop the infusions running through the other lumens to prevent contamination or dilution of the sample", "Increase the infusion rate of the other lumens during the draw", "Use the same lumen infusing TPN for both infusion and the blood draw simultaneously"], "a": [1], "e": ["Drawing blood without pausing other lumens' infusions risks contaminating or diluting the sample and skewing lab results.", "", "Increasing the rate of other infusions during a blood draw does not prevent contamination and is not appropriate.", "Blood should never be drawn from a lumen currently infusing TPN, due to both contamination risk and increased CLABSI risk."], "r": "When drawing blood from a multi-lumen catheter, infusions running through the other lumens should be stopped temporarily to prevent contamination of the sample or dilution that could skew laboratory values.", "tip": "NCLEX Tip: This is a frequently tested detail — always pause other lumen infusions before obtaining a blood sample from any multi-lumen central line."}, {"t": "mc", "q": "Why should a nurse avoid drawing a blood sample from a CVAD lumen that is actively infusing parenteral nutrition?", "o": ["It will not affect the lab results at all", "It increases the risk of CLABSI (central line-associated bloodstream infection)", "TPN lumens cannot physically be used for blood draws", "This is only a concern in pediatric clients"], "a": [1], "e": ["Using a TPN lumen for blood draws can significantly affect (contaminate/dilute) lab results.", "", "The lumen is not physically incapable of being used, but doing so is against best practice due to infection risk.", "This special guideline applies to CVAD care broadly, not just pediatric clients."], "r": "The special guideline for CVAD care is to avoid using a lumen infusing parenteral nutrition for blood sampling, since manipulating this line increases the risk of introducing organisms and developing a CLABSI.", "tip": "NCLEX Tip: TPN lumens are considered higher risk for CLABSI due to the glucose-rich fluid supporting bacterial growth — minimize manipulation of this specific lumen."}, {"t": "mc", "q": "An implanted venous access port (Infusaport) differs from other CVADs primarily because it:", "o": ["Has an external catheter tail that hangs outside the skin at all times", "Is surgically placed entirely under the skin and must be accessed through the skin using a special non-coring needle", "Cannot be used for chemotherapy administration", "Requires daily dressing changes even when not accessed"], "a": [1], "e": ["An external catheter tail describes a tunneled catheter or PICC, not an implanted port.", "", "Implanted ports are commonly used for long-term chemotherapy administration.", "An implanted port that is not currently accessed does not require a dressing at all, since nothing is protruding through the skin."], "r": "An implanted port is a reservoir placed entirely beneath the skin, connected to a catheter that terminates in a central vein; it must be accessed by inserting a special non-coring (Huber) needle through the skin into the port septum using sterile technique.", "tip": "NCLEX Tip: Because nothing is visible when not accessed, implanted ports are the least disruptive CVAD option for a client's daily life between treatments."}, {"t": "mc", "q": "Which type of needle must always be used to access an implanted port?", "o": ["Any standard hypodermic needle", "A non-coring (Huber) needle", "A butterfly needle used for routine venipuncture", "An 18-gauge IV catheter needle"], "a": [1], "e": ["A standard hypodermic needle can core (cut) the port's septum, causing damage and leakage over repeated access.", "", "A butterfly venipuncture needle is not designed for accessing a port's silicone septum.", "A peripheral IV catheter needle is not appropriate for accessing an implanted port."], "r": "All implanted ports must be accessed using a specially designed non-coring (Huber) needle, which has a deflected point that avoids cutting a piece (core) out of the port's self-sealing septum, preserving its integrity for repeated use.", "tip": "NCLEX Tip: 'Non-coring' = does not cut a plug out of the septum, allowing the port to reseal properly after each access."}, {"t": "mc", "q": "How can a nurse identify that an implanted port is a power-injectable type suitable for high-pressure contrast injections during a CT scan?", "o": ["All implanted ports are automatically power-injectable", "By feeling for three tiny bumps arranged in a triangle pattern on the top of the port through the skin", "By checking whether the port is single or dual", "Power-injectable status cannot be determined without surgically exposing the port"], "a": [1], "e": ["Not all implanted ports are power-injectable; using a non-power-injectable port for high-pressure injection can cause catheter rupture.", "", "Being single or dual (number of lumens) does not indicate power-injectable capability.", "The power-injectable feature can be identified externally by palpating the characteristic bump pattern, without surgical exposure."], "r": "A power-injectable implanted port can be identified by three small palpable bumps arranged in a triangular pattern on top of the port, indicating it is designed to safely tolerate the high pressures of power contrast injection for CT or MRI.", "tip": "NCLEX Tip: Using the wrong (non-power-injectable) port for a power injection can cause catheter fracture — always verify power-injectable status before contrast studies."}, {"t": "sata", "q": "Which are recognized potential complications of an implanted port that the nurse should monitor for? Select all that apply.", "o": ["Occlusion", "Extravasation", "Catheter dislodgement", "Improved appetite", "Infection"], "a": [0, 1, 2, 4], "e": ["", "", "", "Improved appetite is not a complication; it would be an unrelated, unexpected positive finding.", ""], "r": "Recognized complications of implanted ports include occlusion, extravasation, infection, air embolism, and catheter dislodgement, all of which require prompt nursing assessment and intervention.", "tip": "NCLEX Tip: When a SATA option describes something clearly positive/unrelated to the device, it is very likely a distractor."}, {"t": "mc", "q": "A client with an implanted port develops a fever of 101.2°F (38.4°C) along with pain and swelling over the port site. The nurse's priority action is to:", "o": ["Reassure the client that this is a normal, expected finding", "Notify the provider promptly, as these findings suggest a possible port-related infection", "Wait until the next scheduled port access to reassess", "Increase the flush volume to resolve the swelling"], "a": [1], "e": ["Fever with local pain/swelling at a port site is abnormal and requires prompt evaluation, not reassurance alone.", "", "These findings warrant prompt reporting, not delay until the next scheduled access.", "Increasing flush volume does not treat a suspected infection and could worsen the client's condition if extravasation or infection is present."], "r": "Fever greater than 100.4°F, along with port pain or swelling, are warning signs of possible infection or another complication and should be reported to the provider promptly for evaluation.", "tip": "NCLEX Tip: Fever + localized site changes at any CVAD = red flag for infection; don't delay reporting."}, {"t": "mc", "q": "Before de-accessing (removing the needle from) an implanted port, the nurse should always:", "o": ["Leave the port unlocked with no flush", "Heparin lock the port per protocol prior to removing the needle", "Remove the dressing only, without flushing", "Access a second port needle simultaneously"], "a": [1], "e": ["Leaving the port unlocked increases the risk of clot formation and occlusion between uses.", "", "Flushing/locking should occur before de-accessing, not just removing the dressing.", "There is no indication to access a second needle simultaneously; only one needle should be used to access the port at a time."], "r": "Most CVADs, including implanted ports, should be heparin locked (per facility protocol) prior to de-accessing to help maintain patency and prevent clot formation until the device is accessed again.", "tip": "NCLEX Tip: 'Always heparin lock prior to de-accessing a port' is explicitly emphasized as a key nursing responsibility."}, {"t": "mc", "q": "A nurse assesses a CVAD dressing and finds it is loose at one corner with slight moisture underneath. The appropriate action is to:", "o": ["Reinforce the loose corner with additional tape and leave the rest of the dressing in place", "Change the dressing immediately, since an intact, occlusive dressing is essential to prevent CLABSI", "Wait until the next scheduled dressing change date", "Document the finding only, with no further action needed"], "a": [1], "e": ["Reinforcing rather than replacing a compromised dressing does not restore a fully occlusive barrier and leaves the site at risk.", "", "A compromised dressing (loose, wet) must be changed immediately regardless of the scheduled change date.", "Documentation alone is insufficient; the compromised dressing itself must be corrected immediately."], "r": "A CVAD dressing must always be clean, dry, and occlusive; if it becomes loose, wet, or otherwise compromised, it must be changed immediately, regardless of the standard dressing change schedule, to reduce CLABSI risk.", "tip": "NCLEX Tip: 'Clean, dry, occlusive' is the standard for every CVAD dressing check — any deviation triggers an immediate change."}, {"t": "mc", "q": "A bio-patch (antimicrobial disk) is present at a client's CVAD insertion site. Per standard practice described in this course, how often should the dressing be changed?", "o": ["Every 24 hours", "Every 3 days", "Every 7 days", "Only when visibly soiled, regardless of time"], "a": [2], "e": ["This is more frequent than necessary when a bio-patch is in place.", "This interval applies when NO antimicrobial device is present, not when a bio-patch is used.", "", "Even with a bio-patch, scheduled changes are still required at set intervals in addition to changing for any disruption in integrity."], "r": "When a bio-patch or other antimicrobial device is used, CVAD dressings are valid for 7 days; without an antimicrobial device, the dressing must be changed within 3 days and a patch applied.", "tip": "NCLEX Tip: Bio-patch present = 7-day dressing change; no antimicrobial device = 3-day change with a patch then applied."}, {"t": "mc", "q": "If a CVAD dressing has no antimicrobial (bio-patch) device present, how frequently must it be changed and what should be done at that time?", "o": ["Every 7 days, no patch needed", "Within 3 days, and an antimicrobial device should be applied", "Every 24 hours indefinitely with no patch ever applied", "There is no required timeframe if the site looks clean"], "a": [1], "e": ["The 7-day interval applies only when a bio-patch/antimicrobial device IS already in place.", "", "Daily changes indefinitely without ever applying an antimicrobial device is not the described protocol.", "A required timeframe exists regardless of how the site appears, to proactively reduce CLABSI risk."], "r": "When no antimicrobial device is present at the CVAD site, the dressing must be changed within 3 days, and an antimicrobial (bio-patch) device should then be applied to extend the next change interval to 7 days.", "tip": "NCLEX Tip: Think of it as a two-step system: no patch = 3-day change (then apply a patch); patch present = 7-day change."}, {"t": "mc", "q": "Which securement method for a CVAD is described as 'sutureless'?", "o": ["Suturing the catheter directly to the skin", "A stat-lock device", "Using only tape with no other securement", "Leaving the catheter completely unsecured"], "a": [1], "e": ["Sutures are, by definition, not a sutureless method.", "", "Tape alone is not the securement method specifically described as 'sutureless' in this content; a stat-lock is the named device.", "Leaving a CVAD unsecured significantly increases the risk of dislodgement and is never appropriate."], "r": "A stat-lock is a sutureless securement device used to stabilize a CVAD to the client's skin, reducing the risk of catheter movement, dislodgement, and associated complications.", "tip": "NCLEX Tip: Securement method (sutures vs. sutureless stat-lock) depends on CVAD type and location, but the goal is always the same — prevent dislodgement."}, {"t": "mc", "q": "Why is proper CVAD securement so important for client safety?", "o": ["It has no real impact on outcomes and is mostly for cosmetic purposes", "Dislodgement and premature removal increase the risk of infection, vessel injury, and treatment delays", "It only matters for pediatric clients", "It eliminates the need for any further site assessment"], "a": [1], "e": ["Securement has significant clinical impact and is not merely cosmetic.", "", "Adequate securement matters for clients of all ages with a CVAD.", "Securement does not replace the need for ongoing site assessment; both are required."], "r": "Proper securement prevents catheter dislodgement and premature removal, which can lead to infection, vessel injury, interrupted therapy, and treatment delays, making it a critical component of safe CVAD management.", "tip": "NCLEX Tip: Securement and dressing integrity work together to prevent both mechanical (dislodgement) and infectious (CLABSI) complications."}, {"t": "mc", "q": "A nurse assesses a CVAD site and is unable to flush the line or aspirate blood return, despite no visible signs of infection. The nurse should suspect:", "o": ["Extravasation", "Occlusion due to clot formation or catheter malpositioning", "Air embolism", "Skin erosion"], "a": [1], "e": ["Extravasation involves leakage of a vesicant into tissue, not primarily an inability to flush/aspirate.", "", "Air embolism presents with sudden respiratory/cardiac symptoms, not simply difficulty flushing.", "Skin erosion involves visible skin breakdown at the exit site, not primarily flushing difficulty."], "r": "Difficulty flushing the catheter or aspirating blood return, without other signs of infection, suggests occlusion from clot formation or catheter malpositioning, requiring further assessment and possible intervention such as repositioning the client or administering a thrombolytic per order.", "tip": "NCLEX Tip: For occlusion, first reposition the client (raise the arm, have them cough/deep breathe, sit up) before assuming the line must be removed."}, {"t": "mc", "q": "A CVAD becomes occluded. Which nursing action should the nurse try FIRST, before escalating further?", "o": ["Immediately remove the catheter", "Reposition the client, such as raising the arm overhead or having them cough and sit up", "Flush forcefully against resistance to clear the occlusion", "Administer a strong IV push medication through the line to test patency"], "a": [1], "e": ["Removal should not be the first action; simple repositioning often resolves an occlusion related to malpositioning.", "", "Flushing forcefully against resistance can rupture the catheter or dislodge a clot into circulation and should never be done.", "Administering medication to 'test' an occluded line risks harm and is not an appropriate assessment method."], "r": "Initial management of a possible CVAD occlusion includes repositioning the client (raising the arm overhead, coughing and deep breathing, sitting up/standing) before considering more invasive measures such as thrombolytics or catheter removal.", "tip": "NCLEX Tip: Never flush against resistance — this is a hard safety rule to prevent catheter rupture or embolization of a clot."}, {"t": "mc", "q": "Which nursing action helps prevent catheter damage or breakage during routine CVAD flushing?", "o": ["Using the smallest syringe available to generate more pressure", "Using a 10-mL syringe, which generates lower pressure and helps prevent catheter rupture", "Flushing forcefully against any resistance encountered", "Using sharp scissors near the catheter when adjusting the dressing"], "a": [1], "e": ["Smaller syringes generate MORE pressure per unit of force, increasing rupture risk — the opposite of what is recommended.", "", "Flushing against resistance risks catheter rupture and should never be done.", "Sharp objects such as scissors should be kept away from the catheter to avoid accidental damage."], "r": "A 10-mL syringe is preferred for flushing CVADs because its larger barrel generates lower pressure for the same force applied, reducing the risk of catheter rupture compared with smaller syringes.", "tip": "NCLEX Tip: Smaller syringe = higher pressure for same force = higher rupture risk. Always use 10 mL or larger for CVAD flushing."}, {"t": "mc", "q": "A nurse suspects a CVAD has a break or leak based on visible fluid leaking from the external catheter segment. The priority action is to:", "o": ["Continue the infusion at the same rate", "Clamp the catheter near the insertion site and place sterile gauze over the break until repair or removal can occur", "Immediately cut the catheter to stop the leak", "Increase the infusion rate to flush out the leak"], "a": [1], "e": ["Continuing to infuse through a damaged catheter can cause fluid loss, air entry, or infection.", "", "Cutting the catheter is not an appropriate nursing action and could worsen the situation or introduce infection/embolism risk.", "Increasing the rate does not address a structural break and could worsen fluid loss or contamination."], "r": "When catheter damage or breakage is suspected, the nurse should clamp the catheter near the insertion site and cover the break with sterile gauze until the line can be safely repaired (using only a manufacturer-approved repair kit) or removed by trained personnel.", "tip": "NCLEX Tip: Clamp proximal to the break, cover with sterile gauze, and notify the provider — never attempt to fix a broken catheter with tape or improvised materials."}, {"t": "mc", "q": "Which assessment finding should make the nurse suspect a CLABSI (central line-associated bloodstream infection)?", "o": ["A clean, dry, intact dressing with no drainage", "Redness, edema, drainage, and tenderness at the insertion site, possibly with fever and elevated WBC", "A slightly displaced dressing with no other findings", "A normal catheter length measurement compared to baseline"], "a": [1], "e": ["This describes a normal, reassuring assessment finding.", "", "A slightly displaced dressing alone, without other signs, is not diagnostic of CLABSI, though it should still be addressed.", "A stable catheter length is a reassuring finding unrelated to infection."], "r": "Signs concerning for CLABSI include redness, edema, drainage, and tenderness at the insertion site, along with systemic signs such as fever and elevated white blood cell count, requiring prompt evaluation and likely blood cultures.", "tip": "NCLEX Tip: CLABSI should always be treated as potentially life-threatening — anticipate blood cultures, possible catheter tip culture, and prompt antibiotics."}, {"t": "mc", "q": "A CVAD is suspected to be the source of a client's new sepsis. The nurse should anticipate which diagnostic step specific to the catheter itself?", "o": ["Removing the catheter and immediately discarding it without culture", "Obtaining a culture of the CVAD tip using sterile scissors and a sterile specimen cup after removal (per order)", "Leaving the catheter in place indefinitely regardless of the suspected source", "Only obtaining peripheral blood cultures with no catheter-specific culture"], "a": [1], "e": ["Discarding the catheter without culturing it misses valuable diagnostic information about the causative organism.", "", "A catheter strongly suspected as an infection source is not simply left in place indefinitely without further evaluation.", "Catheter tip culture, in addition to blood cultures, is an anticipated step when CLABSI is suspected."], "r": "When CLABSI is suspected, the nurse should anticipate an order for the CVAD to be removed by trained personnel with the tip cultured using sterile technique (sterile scissors and specimen cup), along with blood cultures and prompt antibiotic therapy.", "tip": "NCLEX Tip: A suspected CLABSI is treated as a life-threatening event requiring prompt, coordinated action from the whole care team — including infection prevention and vascular access specialists."}, {"t": "mc", "q": "A client's CVAD is incorrectly positioned, causing inadequate blood withdrawal, hypotension, and new-onset cardiac dysrhythmias. What is the nurse's priority action?", "o": ["Continue all infusions and monitor for one more hour", "Stop all fluid and medication administration through the line and anticipate an order for X-ray and ECG", "Increase the infusion rate to compensate for hypotension", "Reposition the client and resume infusions without further evaluation"], "a": [1], "e": ["Continuing infusions through a malpositioned catheter risks worsening cardiac or vascular complications.", "", "Increasing infusion rate does not address a malpositioning problem and could worsen the client's hemodynamic status.", "Simple repositioning of the client does not correct catheter malposition; the line's position must be verified/corrected by trained personnel."], "r": "With signs of incorrect catheter placement (inadequate blood return, hypotension, dysrhythmias, neck vein distension), the nurse should immediately stop all fluid and medication administration and anticipate orders for an X-ray and ECG to reassess line position.", "tip": "NCLEX Tip: New dysrhythmias or hypotension associated with a CVAD should always raise suspicion for catheter migration into the heart."}, {"t": "mc", "q": "A client reports feeling and hearing 'gurgling' near the chest, along with new arm/hand edema and distended neck veins, several days after CVAD placement. This presentation is most consistent with:", "o": ["Skin erosion at the exit site", "Catheter migration from its original position", "A properly functioning catheter", "Simple infiltration of a peripheral IV"], "a": [1], "e": ["Skin erosion involves visible skin breakdown, not these systemic vascular findings.", "", "These findings are abnormal, not consistent with normal function.", "This scenario describes a CVAD, not a peripheral IV, and the symptoms described are not simple infiltration."], "r": "Catheter migration should be suspected when a client develops arm/hand edema, distended neck veins, gurgling sounds, or new dysrhythmias, as the catheter tip may have moved from its original central position; the provider should be notified immediately.", "tip": "NCLEX Tip: A catheter that has migrated externally should never be readvanced; one that has migrated internally must be retracted only by a trained professional."}, {"t": "mc", "q": "A CVAD becomes completely dislodged from the client's chest. The nurse's priority actions are to:", "o": ["Attempt to reinsert the same catheter immediately", "Cover the insertion site and apply direct manual pressure while calling for the rapid response team", "Instruct the client to take a deep breath and hold it with no other action", "Simply document the finding for the next shift"], "a": [1], "e": ["Reinserting a dislodged catheter is not a nursing action and risks introducing infection or injury.", "", "While deep breathing/Valsalva helps during planned chest tube or catheter removal, this alone is not sufficient for an emergent complete dislodgement.", "Documentation alone delays urgent, necessary intervention for a potentially life-threatening event."], "r": "For a completely dislodged CVAD, the nurse should cover the insertion site, apply direct manual pressure, and call for the rapid response team, since the client requires monitoring for possible air embolus and may need reinsertion of access for critical medications.", "tip": "NCLEX Tip: Complete catheter dislodgement is treated as an emergency due to the risk of both bleeding and air embolism at the exposed vein entry site."}, {"t": "mc", "q": "A nurse notes skin separation, drainage, and tissue breakdown at a CVAD exit site with no other systemic symptoms. This finding is best described as:", "o": ["Skin erosion", "Air embolism", "Pneumothorax", "A normal expected finding requiring no intervention"], "a": [0], "e": ["", "Air embolism presents with sudden respiratory/cardiac symptoms, not localized skin breakdown.", "Pneumothorax presents with respiratory distress, not localized exit-site skin findings.", "Skin erosion is an abnormal finding requiring intervention such as skin care and possible catheter removal per order."], "r": "Skin erosion involves breakdown of skin at or around the CVAD exit site, which can be minimized by maintaining optimal nutrition and avoiding repeated access through the same skin site with implanted ports.", "tip": "NCLEX Tip: Preventing skin erosion includes rotating the exact needle insertion point on a port's septum area and supporting adequate nutrition for tissue integrity."}, {"t": "mc", "q": "A client receiving IV therapy through a CVAD suddenly develops dyspnea, continuous coughing, and chest pain during a flushing procedure. The nurse should suspect:", "o": ["A simple vasovagal response unrelated to the catheter", "Air embolism", "Skin erosion", "Catheter kinking with no systemic effect"], "a": [1], "e": ["These specific findings during a flush are classic for air embolism, not an unrelated vasovagal event.", "", "Skin erosion does not cause sudden respiratory/cardiac symptoms.", "Simple catheter kinking would present as difficulty flushing, not sudden dyspnea and chest pain."], "r": "Air embolism occurs when a pressure gradient allows air to enter the bloodstream, often during flushing or catheter removal, presenting with sudden dyspnea, continuous coughing, chest pain, and possible neurological symptoms such as seizures or altered mental status.", "tip": "NCLEX Tip: Any hub open to air or a disengaged clamp is a risk factor for air embolism — always ensure clamps are engaged and hubs are not left open."}, {"t": "mc", "q": "A nurse suspects an air embolism has occurred in a client with a CVAD. Which position should the nurse place the client in immediately?", "o": ["High Fowler's position", "Left side, Trendelenburg (head down) or left lateral decubitus position", "Prone position", "Right side, with the head of bed elevated 90 degrees"], "a": [1], "e": ["High Fowler's position could worsen air movement toward the pulmonary outflow tract.", "", "Prone positioning is not the recommended position for this emergency.", "Right-side positioning with the head elevated is the opposite of the recommended positioning for trapping air away from the pulmonary valve."], "r": "For a suspected air embolism, the client should be placed on their left side in Trendelenburg (or left lateral decubitus) position, which helps trap air in the apex of the right ventricle away from the pulmonary outflow tract, while the nurse calls the rapid response team and notifies the provider.", "tip": "NCLEX Tip: 'Left side, head down' is the exact positioning to memorize for both CVAD-related and blood-sampling-related suspected air embolism."}, {"t": "mc", "q": "A nurse is assisting with insertion of a subclavian central line when the client suddenly develops sharp, stabbing chest pain, shortness of breath, and a dry hacking cough. The nurse should suspect:", "o": ["A normal, expected sensation during line placement", "Pneumothorax from the needle inadvertently piercing the lung", "Simple anxiety about the procedure", "An allergic reaction to the antiseptic"], "a": [1], "e": ["These symptoms are abnormal and concerning, not an expected part of the procedure.", "", "While anxiety can occur during procedures, these specific respiratory findings should not be dismissed as anxiety alone.", "An antiseptic allergy would more likely present with a skin reaction, not these specific respiratory symptoms."], "r": "Pneumothorax can occur during CVAD insertion if the needle misses the vein and punctures the lung; symptoms include sharp stabbing chest pain, shortness of breath, cyanosis, tachypnea, and a dry cough, requiring immediate provider notification.", "tip": "NCLEX Tip: The risk of pneumothorax is a key reason chest X-ray confirmation is required after non-tunneled, bedside-inserted central lines."}, {"t": "mc", "q": "Which finding would indicate infiltration or extravasation at a CVAD site infusing a vesicant medication?", "o": ["A brisk, easy blood return on aspiration with no swelling", "Sponginess around the catheter insertion site, redness or swelling, and pain with infusion", "A clean, dry, intact dressing with no other findings", "Stable vital signs with no complaints from the client"], "a": [1], "e": ["This is a reassuring finding of a patent, functioning line.", "", "This describes a normal, reassuring dressing assessment, not infiltration/extravasation.", "This is a reassuring finding, the opposite of what would be seen with infiltration/extravasation."], "r": "Signs of infiltration or extravasation include sponginess, redness or swelling around the insertion site, and pain with infusion; the nurse should palpate the area, observe IV flow, and aspirate for blood return to help confirm this complication.", "tip": "NCLEX Tip: With a vesicant, extravasation is treated as an emergency — stop the infusion, aspirate remaining drug, and follow protocol for antidote/therapeutic medication as needed."}, {"t": "mc", "q": "A vesicant medication has extravasated from a CVAD into the surrounding tissue. After discontinuing the infusion, the nurse should next:", "o": ["Aspirate any remaining medication from the catheter after disconnection to prevent further vessel damage", "Flush the catheter vigorously to push the medication further into the tissue", "Apply direct heat regardless of the medication involved", "Leave the catheter in place and resume the same infusion once symptoms subside"], "a": [0], "e": ["", "Flushing vigorously would push more of the vesicant into the tissue, worsening the injury.", "Whether heat or cold is applied depends on the specific medication/protocol; heat should not be applied indiscriminately.", "The same infusion should not simply resume through a site where extravasation has already occurred."], "r": "After stopping the infusion, the nurse should aspirate any remaining medication from the catheter to prevent further vessel/tissue damage, then follow protocol for applying warm or cold compresses and administering an antidote or therapeutic medication as appropriate.", "tip": "NCLEX Tip: Order of operations for extravasation: stop infusion → aspirate residual drug → notify provider → apply protocol-specific compress/antidote → anticipate imaging to assess catheter integrity/placement."}, {"t": "sata", "q": "A nurse is reviewing potential CVAD complications with a new graduate nurse. Which of the following statements are accurate? Select all that apply.", "o": ["'Occlusion should be managed by flushing forcefully against resistance to clear the clot.'", "'A CLABSI should be treated as a life-threatening event requiring prompt antibiotics.'", "'Catheter hubs should never be left open to air, to help prevent air embolism.'", "'A catheter that has migrated externally should be readvanced by the nurse.'", "'Pneumothorax can be a complication of CVAD insertion in the neck or chest.'"], "a": [1, 2, 4], "e": ["Flushing against resistance is unsafe and can cause catheter rupture; resistance should never be forced.", "", "", "A catheter that has migrated externally should NOT be readvanced by the nurse; a trained professional must reposition it.", ""], "r": "Accurate statements include that CLABSI is treated as life-threatening, catheter hubs should never be open to air, and pneumothorax is a recognized insertion complication; flushing against resistance and readvancing an externally migrated catheter are unsafe and incorrect practices.", "tip": "NCLEX Tip: 'Needs correction' SATA-style questions require you to sort each option individually against known safety principles."}, {"t": "bowtie", "q": "A client with a tunneled CVAD reports new arm swelling, distended neck veins, and a gurgling sound is audible near the chest. The client denies fever, and the insertion site dressing is clean, dry, and intact.", "conditionOptions": ["Catheter migration from its original position", "Local site infection (CLABSI)", "Simple infiltration of a peripheral IV", "Normal, expected catheter function"], "correctCondition": 0, "conditionExplain": ["", "The dressing is clean/dry/intact and the client is afebrile, making local infection less likely as the primary concern here.", "This client has a CVAD, not a peripheral IV, and the described findings are vascular/positional, not local infiltration.", "These findings (edema, JVD, gurgling) are abnormal and require investigation, not simply routine monitoring."], "actions": ["Notify the provider immediately", "Continue all infusions at the current rate without further action", "Stop non-essential infusions through the line pending evaluation", "Reposition the catheter tip themselves without provider input", "Prepare the client for a chest X-ray as ordered"], "correctActions": [0, 4], "actionsExplain": ["", "Continuing to infuse through a potentially malpositioned catheter could worsen complications and delay necessary evaluation.", "While cautious, this is a secondary consideration; the top two priorities are notifying the provider and confirming position via imaging.", "Only a trained professional may reposition a central catheter; a nurse should never attempt this independently.", ""], "monitor": ["Cardiac rhythm for new dysrhythmias", "Level of neck vein distension and arm edema", "Blood glucose every 15 minutes", "Recent surgical wound healing progress"], "correctMonitor": [0, 1], "monitorExplain": ["", "", "Frequent glucose monitoring is not indicated by this cardiovascular/catheter-related scenario.", "Wound healing is not the priority monitoring parameter in this scenario."], "r": "This presentation (new edema, JVD, gurgling, no signs of local infection) suggests catheter migration. Priority actions are provider notification and obtaining imaging (X-ray) to confirm tip position, while closely monitoring for cardiac dysrhythmias and worsening edema.", "tip": "NCLEX Tip: Distinguish catheter migration (positional/vascular symptoms, often no fever) from CLABSI (fever, redness, drainage at the site) before selecting bowtie actions.", "actionsCount": 2, "monitorCount": 2}, {"t": "mc", "q": "Which nursing responsibility related to CVAD management is performed approximately every 24 hours per institutional policy?", "o": ["Replacing the entire CVAD regardless of condition", "Assessing and documenting the ongoing necessity of the CVAD, advocating for removal when no longer indicated", "Changing the dressing regardless of its condition", "Performing a chest X-ray"], "a": [1], "e": ["Routine replacement of a functioning CVAD is not indicated simply based on time elapsed.", "", "Dressing changes follow specific intervals/condition-based triggers, not necessarily every 24 hours regardless of condition.", "A chest X-ray is not a daily requirement once placement has already been verified."], "r": "The nurse is responsible for assessing the ongoing need for a client's CVAD approximately every 24 hours per institutional policy, documenting this necessity, and advocating for removal as soon as the device is no longer indicated for treatment.", "tip": "NCLEX Tip: Reducing unnecessary CVAD dwell time is a key nurse-driven strategy for CLABSI prevention."}, {"t": "mc", "q": "Which of the following should be documented at least once every shift for a client with a CVAD in an acute care setting?", "o": ["Only the date the catheter was originally inserted", "The insertion site/dressing condition, catheter function, and any signs of complications", "The client's favorite meal preferences", "Only whether the client verbalizes any pain, with no other details"], "a": [1], "e": ["A single historical date does not capture the ongoing assessment needed each shift.", "", "This is unrelated to CVAD safety assessment.", "Pain alone does not capture the complete picture needed for a thorough CVAD assessment."], "r": "A complete CVAD assessment, performed at least once every shift, should include the insertion site and surrounding area, the securement device, functioning of the CVAD, and tip location, all of which should be documented in the client's EMR.", "tip": "NCLEX Tip: A thorough, shift-based CVAD assessment supports early detection of complications and provides essential documentation for quality/safety review."}, {"t": "mc", "q": "Which of the following is an appropriate component of documentation after measuring the external length of a PICC line?", "o": ["Comparing the current measurement to the initial placement verification to detect possible migration or dislodgement", "Recording only the client's weight", "Skipping this measurement since it is not clinically relevant", "Only measuring once at initial insertion and never again"], "a": [0], "e": ["", "Client weight is unrelated to catheter length measurement.", "This measurement is clinically relevant, as it helps detect migration or dislodgement over time.", "This measurement should be repeated regularly (e.g., each shift) and compared to baseline, not measured only once."], "r": "Measuring and documenting the external catheter length allows the nurse to compare current findings to the initial placement verification results, helping detect catheter migration or dislodgement over time.", "tip": "NCLEX Tip: Any unexpected change in external catheter length compared to baseline should prompt further assessment and provider notification."}, {"t": "mc", "q": "A nurse is measuring upper arm circumference for a client with a PICC line to screen for DVT. Where should this measurement be taken, and what change would be concerning?", "o": ["At the wrist; any change greater than 5 cm", "10 cm above the antecubital fossa; an increase of about 3 cm from baseline may indicate edema associated with a DVT", "At the shoulder; any decrease from baseline", "This measurement is not clinically useful and should not be performed"], "a": [1], "e": ["This is not the correct anatomical landmark or threshold described for this assessment.", "", "This is not the correct anatomical landmark, and a decrease is not the concerning direction of change for DVT screening.", "This measurement is a clinically useful, recommended part of ongoing PICC line assessment."], "r": "Upper arm circumference for a PICC line should be measured 10 cm above the antecubital fossa and compared to baseline each shift; an increase of about 3 cm may indicate edema associated with a deep vein thrombosis (DVT).", "tip": "NCLEX Tip: This specific measurement location and the 3 cm threshold are testable, precise details worth memorizing."}, {"t": "mc", "q": "According to Tanner's Model of Clinical Judgment, a nursing student observes a patient lying flat in bed drinking regular (thin) liquid through a straw despite an active aspiration precaution order for thickened liquids. This initial observation represents which phase?", "o": ["Interpreting", "Noticing", "Responding", "Reflecting"], "a": [1], "e": ["Interpreting involves making sense of the data after it has been gathered, which comes after this initial observation.", "", "Responding involves taking action, which has not yet occurred at the point of simple observation.", "Reflecting occurs after the encounter, evaluating what happened."], "r": "Noticing is the initial perceptual grasp of a clinical situation — in this case, simply observing the patient's position and the liquid consistency — before any interpretation or action has occurred.", "tip": "NCLEX Tip: 'Noticing' questions describe the nurse simply observing or gathering data without yet analyzing or acting on it."}, {"t": "mc", "q": "A nursing student sees a patient coughing continuously after drinking thin liquid despite aspiration precautions, and thinks, 'This matches what I learned about aspiration risk — this is serious.' This best reflects which phase of Tanner's Model?", "o": ["Noticing", "Interpreting", "Responding", "Reflecting"], "a": [1], "e": ["Noticing was the initial observation of the coughing and color change, which already occurred before this thought process.", "", "Responding involves calling for help and taking action, which comes after this interpretive thought.", "Reflecting occurs after the encounter has ended."], "r": "Interpreting involves making sense of the gathered data by connecting it to prior learning and forming a clinical judgment about what is happening, which is demonstrated by the student's recognition that this represents aspiration risk.", "tip": "NCLEX Tip: Interpreting = connecting observed cues to prior knowledge to form a clinical picture ('this matches what I learned about...')."}, {"t": "mc", "q": "In the aspiration case study, the student immediately calls for help, encourages the patient to keep coughing, and stays with the patient until the nurse arrives. This is an example of which phase of Tanner's Model?", "o": ["Noticing", "Interpreting", "Responding", "Reflecting"], "a": [2], "e": ["Noticing was the earlier data-gathering step.", "Interpreting was the earlier analysis step.", "", "Reflecting occurs after the event, not during the active response."], "r": "Responding is the phase in which the nurse (or student) acts on their clinical judgment — in this case, calling for help, staying with the patient, and encouraging continued coughing to help clear the airway.", "tip": "NCLEX Tip: Responding = the action phase; look for verbs like 'calls,' 'stays,' 'notifies,' or 'administers.'"}, {"t": "mc", "q": "After the aspiration event resolves, the student and preceptor discuss what signs indicated distress and how to prevent future incidents. This discussion best reflects which phase of Tanner's Model?", "o": ["Noticing", "Interpreting", "Responding", "Reflecting"], "a": [3], "e": ["Noticing already occurred at the start of the encounter.", "Interpreting already occurred earlier in the encounter.", "Responding already occurred during the active event.", ""], "r": "Reflecting occurs after the clinical event, when the nurse and student review what happened, evaluate their actions, and identify strategies (such as bigger signage or family education) to prevent recurrence.", "tip": "NCLEX Tip: Reflecting is the only phase that occurs after the encounter has ended and directly supports ongoing professional growth."}, {"t": "mc", "q": "In the case of Ms. Garcia with a nasopharyngeal airway (NPA), the student notices increased bloody drainage from the nostril, noisy breathing, and an oxygen saturation of 91%. What should the student do?", "o": ["Say nothing since students should not raise concerns to instructors", "Report these specific findings to the instructor, even if unsure whether they represent a true problem", "Wait until the trauma team happens to notice on their own", "Remove the NPA independently to inspect it"], "a": [1], "e": ["Withholding observations, especially concerning ones, could delay recognition of a worsening airway problem.", "", "Waiting passively rather than reporting delays potential intervention.", "A student should not independently remove or manipulate an airway device; this should be reported to and managed by qualified staff."], "r": "Even as a student, reporting specific concerning observations (increased bleeding, noisy breathing, falling oxygen saturation) to the instructor or nurse is essential, since this information may reveal a partially obstructed airway needing prompt suctioning or intervention.", "tip": "NCLEX Tip: 'Noticing' and 'speaking up' are foundational nursing behaviors regardless of experience level — students are taught that reporting uncertain findings is good clinical judgment, not a weakness."}, {"t": "mc", "q": "In Ms. Garcia's case, the trauma team discovers blood and secretions partially blocking the NPA. What intervention improved her oxygen saturation from 91% to 96%?", "o": ["Removing the NPA permanently with no further airway support", "Suctioning the NPA to remove the blood clots and mucus obstructing it", "Administering oral fluids", "Repositioning the patient prone"], "a": [1], "e": ["The NPA was suctioned and kept in place, not permanently removed with no replacement airway support.", "", "Oral fluids are inappropriate and unsafe for an unconscious trauma patient.", "Prone repositioning was not the intervention performed in this scenario."], "r": "Suctioning the NPA removed the blood clots and mucus that were partially obstructing the airway, which improved airway patency and increased the patient's oxygen saturation from 91% to 96%.", "tip": "NCLEX Tip: Patients with an NPA require frequent monitoring because secretions and blood can accumulate and progressively obstruct the airway if not cleared."}, {"t": "mc", "q": "In the tracheostomy care case study, the student observes redness around the stoma, dried crusty secretions, and gurgling breath sounds. What should be done FIRST, before cleaning the site?", "o": ["Apply a new dressing immediately without addressing the noise", "Suction the tracheostomy first to remove secretions causing the gurgling sound", "Change the tracheostomy ties before anything else", "Ignore the gurgling since it is expected with all tracheostomies"], "a": [1], "e": ["Applying a dressing before suctioning does not address the secretions interfering with the patient's breathing and cleaning technique.", "", "Tie assessment/change is an important but later step in the sequence described.", "Gurgling breath sounds indicate secretions in the airway that should be addressed, not ignored."], "r": "The instructor explains that suctioning should always occur first, before cleaning the tracheostomy site, so that secretions do not interfere with the cleaning process; suctioning also directly improves the patient's breathing.", "tip": "NCLEX Tip: The sequence for trach care is: suction first, then clean the site, then apply a clean pre-cut dressing, then check the ties."}, {"t": "mc", "q": "When performing tracheostomy dressing changes, why should regular gauze never be cut to fit around the tube?", "o": ["Cut gauze threads can shed and enter the airway", "Cut gauze is more expensive than pre-cut trach dressings", "Regular gauze cannot absorb any drainage", "There is no specific reason; either type of gauze is acceptable"], "a": [0], "e": ["", "Cost is not the safety rationale for this rule.", "Regular gauze absorbs drainage adequately, so absorbency is not the issue.", "There is a specific, evidence-based safety reason: fraying threads from cut gauze."], "r": "Cutting regular gauze creates loose threads that can fray and potentially be aspirated into the tracheostomy and airway, so only specially designed, pre-cut tracheostomy dressings should be used around the tube.", "tip": "NCLEX Tip: Always use manufactured, pre-cut trach dressings — never scissors-cut standard gauze — to avoid introducing loose fibers into the airway."}, {"t": "mc", "q": "When assessing tracheostomy ties for proper fit, the nurse should be able to:", "o": ["Fit an entire hand comfortably underneath the ties", "Fit one finger comfortably underneath the ties", "Not fit any fingers underneath, indicating a snug and safe fit", "The tightness of ties does not matter as long as the tube stays in place"], "a": [1], "e": ["This would indicate the ties are far too loose, risking accidental dislodgement.", "", "No space at all indicates the ties are too tight, which can impair circulation and cause skin breakdown.", "Tie tightness directly affects both safety (dislodgement risk) and skin integrity, so it does matter significantly."], "r": "Tracheostomy ties should be snug enough to prevent accidental dislodgement, but loose enough that the nurse can comfortably fit one finger underneath, balancing security with prevention of skin breakdown or impaired circulation.", "tip": "NCLEX Tip: 'One-finger rule' is a simple, testable safety check for tracheostomy tie tightness."}, {"t": "mc", "q": "Which of the following best reflects why a first-year nursing student was still valuable during the tracheostomy care scenario, even though they could not yet perform the procedure independently?", "o": ["Students provide no real value until they can perform every skill unsupervised", "The student's careful observation identified important findings (redness, dried secretions) that guided the plan of care", "Students should avoid touching any supplies during the procedure", "Observation without hands-on skill has no educational value"], "a": [1], "e": ["This undervalues the important role of careful observation and assessment, which students can perform even before mastering hands-on skills.", "", "The student appropriately assisted by handing supplies and holding the dressing, showing safe, graded participation.", "Observation and assessment skills are foundational and highly valuable, even before a learner is independent with hands-on technique."], "r": "The case study emphasizes that even as a first-year student, careful observation of assessment findings (skin redness, dried secretions, patient behavior) provided valuable clinical information that guided appropriate tracheostomy care, reinforcing that noticing is a critical, learnable nursing skill at every level.", "tip": "NCLEX Tip: Tanner's Model applies to learners at every stage — 'Noticing' skillfully is something a first-year student can already begin to develop."}, {"t": "sata", "q": "Which of the following are appropriate steps in providing basic tracheostomy care, in the correct conceptual order emphasized in the case study? Select all that apply, ignoring order for this SATA format.", "o": ["Suction the tracheostomy to clear secretions", "Clean around the tube working in a circular motion outward with saline-moistened swabs", "Cut a piece of regular gauze to fit snugly around the tube", "Apply a clean, pre-cut tracheostomy dressing", "Check that the ties allow one finger to fit comfortably underneath"], "a": [0, 1, 3, 4], "e": ["", "", "Cutting regular gauze can create loose threads that risk aspiration into the airway and should never be done.", "", ""], "r": "Appropriate tracheostomy care steps include suctioning first, cleaning the site outward in a circular motion, applying a pre-cut trach dressing, and verifying tie fit with the one-finger rule; cutting standard gauze is unsafe and should never be performed.", "tip": "NCLEX Tip: SATA questions on procedural steps often embed one unsafe 'shortcut' distractor (like cutting gauze) — always evalu
